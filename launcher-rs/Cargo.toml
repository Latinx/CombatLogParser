[package]
name = "combat-log-parser-launcher"
version = "0.2.0"
edition = "2024"

[dependencies]
minreq = { version = "2", features = ["https-rustls"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
# strip removed — it strips PE metadata which triggers AV flags; binary is small enough

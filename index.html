<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat Log Parser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink-well: #060914;
  --parchment: #0d1426;
  --parchment-raised: #141f36;
  --gold-vein: #ffb14a;
  --gold-glint: #ffd08a;
  --ink: #eef4ff;
  --ink-muted: #aab7cf;
  --ink-faint: #647089;
  --gridline: rgba(137, 171, 255, 0.12);
  --void-blue: #0a1020;
  --rune-violet: #7d5cff;
  --healer-mint: #62f2c2;
  --wipe-red: #ff5b6e;

  --class-warrior: #c69b6d;
  --class-paladin: #f48cba;
  --class-hunter: #aad372;
  --class-rogue: #fff468;
  --class-priest: #ffffff;
  --class-dk: #c41e3a;
  --class-shaman: #0070dd;
  --class-mage: #3fc7eb;
  --class-warlock: #8788ee;
  --class-monk: #00ff98;
  --class-dh: #a330c9;
  --class-evoker: #33937f;

  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Inter Tight', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Fira Code', monospace;

  --text-xs: 0.7rem;
  --text-sm: 0.8125rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: clamp(1.75rem, 1.5rem + 1.25vw, 2.5rem);
  --text-3xl: clamp(2.25rem, 1.75rem + 2.5vw, 3.5rem);

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 10px;

  --transition-fast: 120ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 350ms ease;

  --header-h: 64px;
}

@media (prefers-reduced-motion: reduce) {
:root {
  --transition-fast: 0ms;
  --transition-base: 0ms;
  --transition-slow: 0ms;
}
*, *::before, *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 12%, rgba(125, 92, 255, 0.22), transparent 26rem),
    radial-gradient(circle at 88% 18%, rgba(255, 177, 74, 0.13), transparent 24rem),
    linear-gradient(180deg, #070b17 0%, #050713 100%);
  min-height: 100vh;
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: 1fr;
  letter-spacing: -0.01em;
}

::-webkit-scrollbar { width: 8px; height: 8px; }

::-webkit-scrollbar-track { background: var(--ink-well); }

::-webkit-scrollbar-thumb { background: var(--parchment-raised); border-radius: 4px; border: 2px solid var(--ink-well); }

::-webkit-scrollbar-thumb:hover { background: var(--gold-vein); }

.header {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-6);
  background: rgba(6, 9, 20, 0.82);
  border-bottom: 1px solid var(--gridline);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 100;
  animation: slideDown var(--transition-slow) ease-out;
}

@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.header__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--ink);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.header__title::before {
  content: 'BLACKBOX / ';
  color: var(--gold-vein);
}

.header__actions { display: flex; gap: var(--space-3); align-items: center; }

.header__tab[aria-selected="true"] {
  border-color: rgba(255, 177, 74, 0.55);
  color: var(--gold-glint);
  box-shadow: 0 0 0 1px rgba(255, 177, 74, 0.18) inset;
}

.main {
  grid-column: 1;
  grid-row: 2;
  padding: var(--space-8) var(--space-10);
  overflow-y: auto;
  animation: fadeUp var(--transition-slow) ease-out var(--space-3) both;
  position: relative;
}

.main::before {
  content: '';
  position: fixed;
  inset: var(--header-h) 0 0 0;
  pointer-events: none;
  opacity: 0.44;
  background-image:
    linear-gradient(var(--gridline) 1px, transparent 1px),
    linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at 50% 20%, black, transparent 72%);
}

@keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.upload-zone {
  border: 1px solid rgba(255, 177, 74, 0.34);
  border-radius: 28px;
  padding: var(--space-16) var(--space-8);
  text-align: center;
  background:
    linear-gradient(135deg, rgba(125, 92, 255, 0.18), transparent 35%),
    repeating-linear-gradient(90deg, transparent 0 18px, rgba(98, 242, 194, 0.06) 18px 20px),
    linear-gradient(180deg, rgba(20, 31, 54, 0.94), rgba(8, 12, 26, 0.94));
  transition: all var(--transition-base);
  position: relative;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38), inset 0 0 0 1px rgba(255,255,255,0.04);
}

.upload-zone::before {
  content: '';
  position: absolute;
  inset: 18% -20%;
  background: linear-gradient(90deg, transparent, rgba(98, 242, 194, 0.0) 20%, rgba(98, 242, 194, 0.48) 21%, transparent 22%, transparent 42%, rgba(255, 177, 74, 0.48) 43%, transparent 44%, transparent);
  opacity: 0.5;
  transform: skewY(-8deg);
  animation: combatPulse 5.5s linear infinite;
}

@keyframes combatPulse { from { translate: -28% 0; } to { translate: 28% 0; } }

.upload-zone:hover,
.upload-zone.drag-active {
  border-color: var(--healer-mint);
  transform: translateY(-2px);
}

.upload-zone:hover::before,
.upload-zone.drag-active::before { opacity: 0.82; }

.upload-zone__icon {
  width: 80px;
  height: 80px;
  margin: 0 auto var(--space-6);
  stroke: var(--healer-mint);
  opacity: 0.82;
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } }

.upload-zone__title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.06em;
  margin-bottom: var(--space-2);
}

.upload-zone__desc {
  color: var(--ink-muted);
  font-size: var(--text-base);
  max-width: 400px;
  margin: 0 auto var(--space-6);
}

.upload-zone__hint {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--gold-glint);
  background: rgba(6, 9, 20, 0.68);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  display: inline-block;
  border: 1px solid var(--gridline);
}

.upload-zone__status {
  display: block;
  margin-top: var(--space-4);
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}

.import-progress {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-6);
  border: 1px solid rgba(244, 217, 128, 0.18);
  border-radius: 16px;
  background:
    linear-gradient(90deg, rgba(244, 217, 128, 0.08), transparent 42%),
    rgba(6, 9, 20, 0.78);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
}

.import-progress__title {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 650;
}

.import-progress__bar {
  height: 12px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
}

.import-progress__fill {
  width: var(--progress, 0%);
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--rune-violet), var(--gold-vein), var(--healer-mint));
  transition: width 120ms ease-out;
}

.import-progress__meta {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}

.fight-list { display: flex; flex-direction: column; gap: var(--space-3); }

.fight-card {
  background:
    linear-gradient(90deg, rgba(255, 177, 74, 0.07), transparent 38%),
    linear-gradient(90deg, rgba(20, 31, 54, 0.92), rgba(13, 20, 38, 0.76));
  border: 1px solid var(--gridline);
  border-radius: 10px;
  padding: 10px 14px;
  display: grid;
  grid-template-columns: minmax(280px, 1.15fr) minmax(210px, 0.7fr) minmax(190px, 0.62fr) minmax(300px, 0.9fr) minmax(420px, 1.25fr) 26px;
  gap: var(--space-3);
  align-items: center;
  transition: all var(--transition-fast);
  cursor: pointer;
  animation: fadeUp var(--transition-base) ease-out both;
  position: relative;
  overflow: hidden;
}

.fight-card::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.045), transparent);
  transform: translateX(-115%);
}

.fight-card:hover::after { animation: telemetrySweep 900ms ease-out; }

@keyframes telemetrySweep { to { transform: translateX(115%); } }

.fight-card:nth-child(1) { animation-delay: 50ms; }
.fight-card:nth-child(2) { animation-delay: 100ms; }
.fight-card:nth-child(3) { animation-delay: 150ms; }
.fight-card:nth-child(4) { animation-delay: 200ms; }
.fight-card:nth-child(5) { animation-delay: 250ms; }

.fight-card:hover {
  border-color: rgba(255, 177, 74, 0.54);
  background: linear-gradient(90deg, rgba(30, 42, 72, 0.98), rgba(13, 20, 38, 0.86));
  transform: translateX(3px);
}

.fight-card:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-vein); }

.fight-card__boss {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.04em;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fight-card__topline {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
}

.fight-card__status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  padding: var(--space-1) var(--space-2);
  border: 1px solid rgba(74, 222, 128, 0.35);
  border-radius: 999px;
  color: #4ade80;
  background: rgba(74, 222, 128, 0.09);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fight-card__status--pvp {
  border-color: rgba(125, 92, 255, 0.4);
  color: var(--healer-mint);
  background: rgba(125, 92, 255, 0.13);
}

.fight-card__subline {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-top: var(--space-1);
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}

.fight-card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-3);
  align-items: center;
}

.fight-card__meta-item {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font-size: var(--text-sm);
  color: var(--ink-muted);
}

.fight-card__meta-label {
  color: var(--ink-faint);
  font-family: var(--font-mono);
  font-size: 0.56rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fight-card__meta-value {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fight-card__meta-item--duration { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }

.fight-card__meta-item--difficulty {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  font-size: var(--text-xs);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  background: rgba(125, 92, 255, 0.18);
  color: var(--healer-mint);
}

.fight-card__meta-item--kill { color: #4ade80; font-weight: 600; }

.fight-card__meta-item--wide { min-width: 0; }

.fight-card__spotlight { min-width: 0; }

.fight-card__spotlight-label {
  display: block;
  color: var(--ink-faint);
  font-family: var(--font-mono);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fight-card__spotlight-name {
  display: block;
  margin-top: var(--space-1);
  color: var(--ink);
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fight-card__spotlight-value {
  display: block;
  color: var(--gold-glint);
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}

.fight-card__spotlight .fight-card__status { margin-top: var(--space-2); }

.fight-card__players { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.fight-card__team {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.fight-card__team-label {
  width: 52px;
  color: var(--ink-faint);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fight-card__team-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}

.fight-card__player {
  display: inline-flex;
  align-items: center;
  max-width: 160px;
  padding: 2px 7px;
  border-left: 3px solid currentColor;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.045);
  color: var(--player-color, var(--ink-muted));
  font-family: var(--font-mono);
  font-size: 0.68rem;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fight-card__player--friendly { box-shadow: inset 0 -1px 0 rgba(98, 242, 194, 0.28); }

.fight-card__player--hostile { box-shadow: inset 0 -1px 0 rgba(255, 91, 110, 0.32); }

.fight-card__player--more {
  border-left-color: var(--gridline);
  color: var(--ink-faint);
}

.fight-card__arrow {
  position: absolute;
  right: var(--space-4);
  bottom: var(--space-4);
  width: 24px;
  height: 24px;
  stroke: var(--ink-muted);
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.fight-card:hover .fight-card__arrow { stroke: var(--gold-vein); transform: translateX(4px); }

.fight-card__spotlight,
.fight-card__composition,
.fight-card__signal { min-width: 0; }

.fight-card__spotlight-meter::-webkit-meter-bar,
.fight-card__intensity-meter::-webkit-meter-bar {
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
}

.fight-card__spotlight-meter::-webkit-meter-optimum-value,
.fight-card__intensity-meter::-webkit-meter-optimum-value {
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-vein), var(--gold-glint));
}

.fight-card__spotlight-meter,
.fight-card__intensity-meter {
  display: block;
  width: 100%;
  height: 8px;
  margin-top: var(--space-2);
  appearance: none;
}

.fight-card__composition {
  display: grid;
  grid-template-columns: auto minmax(90px, 1fr);
  gap: var(--space-2);
  align-items: center;
  min-width: 0;
}

.fight-card__composition-bar {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: var(--friendly-share, 1fr) var(--hostile-share, 1fr) var(--unknown-share, 0fr);
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
}

.fight-card__composition-bar span:nth-child(1) { background: var(--healer-mint); }
.fight-card__composition-bar span:nth-child(2) { background: var(--wipe-red); }
.fight-card__composition-bar span:nth-child(3) { background: var(--ink-faint); }

.fight-card__composition-counts {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  white-space: nowrap;
}

.fight-card__players { min-width: 0; }

.fight-card__signal {
  min-width: 0;
}

.fight-card__signal-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  color: var(--ink-faint);
  font-family: var(--font-mono);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fight-card__signal-value { color: var(--ink); font-size: var(--text-xs); letter-spacing: 0; text-transform: none; }

.fight-card__bar {
  height: 8px;
  margin-top: var(--space-2);
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
}

.fight-card__bar-fill {
  display: block;
  height: 100%;
  width: var(--bar-width, 0%);
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold-vein), var(--gold-glint));
  animation: barPulse 1.8s ease-in-out infinite;
}

.fight-card__bar-fill--activity { background: linear-gradient(90deg, var(--rune-violet), var(--healer-mint)); }

@keyframes barPulse { 50% { filter: brightness(1.25); } }

.fight-detail { animation: fadeUp var(--transition-slow) ease-out both; }

.fight-subnav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
  padding: var(--space-2);
  border: 1px solid var(--gridline);
  border-radius: 999px;
  background: rgba(6, 9, 20, 0.54);
}

.fight-subnav__item {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink-muted);
  padding: var(--space-2) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
}

.fight-subnav__item:hover,
.fight-subnav__item[aria-selected="true"] {
  background: rgba(255, 177, 74, 0.14);
  color: var(--ink);
}

.fight-subpanel {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.fight-detail__header {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4) var(--space-6);
  align-items: flex-end;
  margin-bottom: var(--space-8);
  padding-bottom: var(--space-6);
  border-bottom: 1px solid rgba(201, 168, 76, 0.15);
}

.fight-detail__boss {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  color: var(--gold-glint);
  line-height: 1.1;
}

.fight-detail__meta { display: flex; flex-wrap: wrap; gap: var(--space-4); }

.fight-detail__meta-item { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--ink-muted); }

strong { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.timeline {
  background: rgba(13, 20, 38, 0.84);
  border: 1px solid var(--gridline);
  border-radius: 24px;
  padding: var(--space-6);
  margin-bottom: var(--space-8);
  position: relative;
  overflow: hidden;
}

.timeline::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--healer-mint), var(--gold-vein), transparent);
}

.timeline__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4); }

.timeline__title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.05em;
}

.timeline__controls { display: flex; gap: var(--space-2); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--gridline);
  background: rgba(20, 31, 54, 0.82);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.btn:hover { border-color: var(--gold-vein); color: var(--gold-glint); background: rgba(255, 177, 74, 0.11); }

.btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-vein); }

.btn--primary { background: var(--gold-vein); border-color: var(--gold-vein); color: var(--ink-well); }

.btn--primary:hover { background: var(--gold-glint); border-color: var(--gold-glint); }

.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.timeline__boss-hp {
  height: 48px;
  background: var(--ink-well);
  border-radius: var(--radius-md);
  position: relative;
  margin-bottom: var(--space-6);
  overflow: hidden;
  border: 1px solid rgba(201, 168, 76, 0.1);
}

.timeline__hp-bar {
  height: 100%;
  background: linear-gradient(90deg, #c41e3a 0%, #e03e3e 50%, #c41e3a 100%);
  border-radius: var(--radius-md);
  transform-origin: left;
  transform: scaleX(0);
  animation: hpDraw 1.2s ease-out 0.3s forwards;
  position: relative;
}

@keyframes hpDraw { to { transform: scaleX(1); } }

.timeline__hp-phase {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--gold-vein);
  opacity: 0;
  animation: phasePop 0.3s ease-out forwards;
}

@keyframes phasePop { to { opacity: 1; transform: scaleY(1); } }

.timeline__phase-labels {
  display: flex;
  justify-content: space-between;
  padding: var(--space-3) var(--space-2) 0;
  font-size: var(--text-xs);
  color: var(--ink-faint);
  font-family: var(--font-mono);
}

.timeline__tracks { display: flex; flex-direction: column; gap: var(--space-3); }

.track {
  height: 44px;
  background: var(--ink-well);
  border-radius: var(--radius-sm);
  position: relative;
  border: 1px solid rgba(201, 168, 76, 0.08);
  overflow: hidden;
}

.track__label {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 140px;
  display: flex;
  align-items: center;
  padding-left: var(--space-3);
  background: linear-gradient(90deg, var(--parchment) 0%, transparent 100%);
  border-right: 1px solid rgba(201, 168, 76, 0.1);
  z-index: 2;
  pointer-events: none;
}

.track__class-color {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: var(--space-3);
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}

.track__name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track__spec {
  font-size: var(--text-xs);
  color: var(--ink-muted);
  margin-left: var(--space-2);
  white-space: nowrap;
}

.track__events {
  position: absolute;
  left: 140px; right: 0; top: 0; bottom: 0;
  display: flex;
  align-items: center;
  padding: 0 var(--space-2);
}

.event {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 8px;
  height: 8px;
  border-radius: 2px;
  cursor: pointer;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  z-index: 1;
  animation: eventPop 0.4s ease-out forwards;
}

@keyframes eventPop { to { transform: translateY(-50%) scale(1); } }

.event--damage { background: #ff6b6b; border-radius: 1px; }
.event--heal { background: #4ade80; border-radius: 50%; }
.event--cd { background: var(--gold-vein); border-radius: 1px; transform: translateY(-50%) rotate(45deg) scale(0); }
.event--mechanic { background: #fbbf24; border-radius: 50%; border: 2px solid var(--ink-well); }
.event--death { background: var(--ink-well); border: 2px solid #f87171; border-radius: 1px; width: 10px; height: 10px; }

.event:hover {
  transform: translateY(-50%) scale(2.5);
  box-shadow: 0 0 12px currentColor;
  z-index: 10;
}

.event--cd:hover { transform: translateY(-50%) rotate(45deg) scale(2.5); }

.event__tooltip {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: var(--ink-well);
  border: 1px solid var(--gold-vein);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-xs);
  line-height: 1.5;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
  z-index: 20;
  font-family: var(--font-mono);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.event:hover .event__tooltip { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.event__tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--gold-vein);
}

.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-4);
}

.player-card {
  background: var(--parchment);
  border: 1px solid rgba(201, 168, 76, 0.12);
  border-radius: var(--radius-md);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  transition: all var(--transition-fast);
  animation: fadeUp var(--transition-base) ease-out both;
}

.player-card:hover { border-color: var(--gold-vein); background: var(--parchment-raised); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

.player-card__header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid rgba(201, 168, 76, 0.1);
}

.player-card__class-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 10px currentColor;
}

.player-card__name {
  font-weight: 600;
  font-size: var(--text-base);
  color: var(--player-color, var(--ink));
  flex: 1;
}

.player-card__spec {
  font-size: var(--text-xs);
  color: var(--ink-muted);
  text-transform: capitalize;
}

.player-card__stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }

.stat { display: flex; flex-direction: column; gap: var(--space-1); }

.stat__label {
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  font-weight: 600;
}

.stat__value {
  font-family: var(--font-mono);
  font-size: var(--text-lg);
  font-variant-numeric: tabular-nums;
  color: var(--gold-glint);
  font-weight: 600;
}

.raw-log {
  background: rgba(6, 9, 20, 0.88);
  border: 1px solid var(--gridline);
  border-radius: 24px;
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.5;
}

.raw-log__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-3) var(--space-4);
  background: rgba(20, 31, 54, 0.8);
  border-bottom: 1px solid var(--gridline);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--ink);
  font-family: var(--font-body);
}

.raw-log__content {
  max-height: 400px;
  overflow: auto;
  padding: var(--space-4);
}

.raw-log__line {
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
  white-space: pre-wrap;
  word-break: break-word;
}

.raw-log__line:hover { background: rgba(125, 92, 255, 0.11); }

.raw-log__line--highlight { background: rgba(255, 177, 74, 0.13); color: var(--gold-glint); }

.raw-log__timestamp { color: var(--gold-vein); }

.raw-log__event { color: var(--gold-glint); font-weight: 500; }

.raw-log__source { color: var(--class-mage); }

.raw-log__target { color: var(--class-priest); }

.raw-log__spell { color: #fbbf24; }

.raw-log__amount { color: #4ade80; font-variant-numeric: tabular-nums; }



.empty-state {
  text-align: center;
  padding: var(--space-16) var(--space-8);
  color: var(--ink-muted);
}

.empty-state__icon { width: 64px; height: 64px; margin: 0 auto var(--space-6); stroke: var(--ink-faint); opacity: 0.5; }

.empty-state__title { font-family: var(--font-display); font-size: var(--text-2xl); color: var(--ink); margin-bottom: var(--space-2); }

.empty-state__desc { max-width: 400px; margin: 0 auto; }

.overall-hero {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}

.overall-hero__stat {
  background: linear-gradient(135deg, rgba(20, 31, 54, 0.92), rgba(13, 20, 38, 0.8));
  border: 1px solid rgba(201, 168, 76, 0.15);
  border-radius: 16px;
  padding: var(--space-5) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.overall-hero__label {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.overall-hero__value {
  font-family: var(--font-mono);
  font-size: var(--text-2xl);
  color: var(--gold-glint);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.overall-hero__sub {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--ink-muted);
}

.breakdown-view {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.breakdown-controls {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  flex-wrap: wrap;
  background: rgba(6, 9, 20, 0.72);
  padding: var(--space-2) var(--space-3);
  border-radius: 14px;
  border: 1px solid var(--gridline);
}

.breakdown-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin: var(--space-2) 0 0;
  padding: var(--space-2) var(--space-3);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 10px;
  background: rgba(6, 9, 20, 0.52);
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.breakdown-section:first-child { margin-top: 0; }

.breakdown-section--friendly { border-left: 3px solid var(--healer-mint); }

.breakdown-section--hostile { border-left: 3px solid var(--wipe-red); }

.breakdown-section--other { border-left: 3px solid var(--ink-faint); }

.filter-btn {
  background: transparent;
  border: 1px solid var(--gridline);
  color: var(--ink-muted);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.filter-btn:hover {
  border-color: var(--gold-vein);
  color: var(--ink);
}

.filter-btn--active {
  background: var(--gold-vein);
  color: #211404;
  border-color: var(--gold-glint);
  font-weight: 600;
}

.breakdown-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 12px;
}

.report-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}

.report-panel {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(137, 171, 255, 0.18);
  border-radius: 16px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(137, 171, 255, 0.07), transparent 44px),
    rgba(6, 9, 20, 0.62);
  box-shadow: inset 0 1px 0 rgba(244, 217, 128, 0.06), 0 14px 36px rgba(0, 0, 0, 0.20);
}

.report-panel__header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background:
    linear-gradient(90deg, rgba(244, 217, 128, 0.10), transparent 42%),
    rgba(9, 14, 27, 0.82);
  border-bottom: 1px solid rgba(244, 217, 128, 0.13);
}

.report-panel__title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.02em;
}

.report-panel__meta {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.68rem;
}

.report-panel .breakdown-list {
  flex: 0 1 auto;
  max-height: min(62vh, 520px);
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  overscroll-behavior: contain;
}

.report-panel--expanded {
  grid-column: auto;
}

.report-panel--expanded .breakdown-list {
  max-height: min(68vh, 620px);
  overflow-y: auto;
  overflow-x: hidden;
}

.report-panel .breakdown-row,
.report-panel .breakdown-row__spells,
.report-panel .spell-row {
  flex: 0 0 auto;
  max-width: 100%;
}

.report-panel .breakdown-row__header,
.report-panel .spell-row {
  grid-template-columns: minmax(150px, 1fr) minmax(120px, 0.8fr) minmax(138px, auto);
}

.report-panel .breakdown-row__spells {
  margin-right: 4px;
  overflow: hidden;
}

.report-panel .spell-row > .breakdown-row__spells {
  margin-right: 0;
}

.report-panel .breakdown-row--minion::before {
  top: 0;
  bottom: 0;
}

.report-panel .breakdown-row--minion .breakdown-row__header::before,
.report-panel .spell-row::before {
  left: 8px;
  width: 8px;
}

.report-panel .spell-row::before {
  left: 4px;
  width: 8px;
}

.breakdown-row {
  position: relative;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.035), transparent 38%),
    rgba(9, 14, 27, 0.90);
  border: 1px solid rgba(137, 171, 255, 0.09);
  border-radius: 7px;
  overflow: hidden;
  transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
}

.breakdown-row:hover {
  background:
    linear-gradient(90deg, rgba(244, 217, 128, 0.08), transparent 42%),
    rgba(18, 28, 50, 0.94);
  border-color: rgba(244, 217, 128, 0.20);
}

.breakdown-row--friendly { --group-color: var(--healer-mint); }

.breakdown-row--hostile { --group-color: var(--wipe-red); }

.breakdown-row--other { --group-color: var(--ink-faint); }

.breakdown-row--total {
  border-color: rgba(244, 217, 128, 0.16);
  background:
    linear-gradient(90deg, rgba(244, 217, 128, 0.08), transparent 34%),
    rgba(10, 16, 31, 0.96);
}

.breakdown-row[aria-expanded="true"] {
  border-color: rgba(244, 217, 128, 0.34);
  box-shadow: inset 3px 0 0 var(--gold-vein), 0 0 0 1px rgba(244, 217, 128, 0.06);
}

.breakdown-row--minion .breakdown-row__header {
  padding-left: 38px;
}

.breakdown-row--minion .breakdown-row__info strong {
  color: var(--ink-muted);
}

.breakdown-row--minion {
  margin-left: 18px;
  border-color: rgba(98, 242, 194, 0.13);
  background:
    linear-gradient(90deg, rgba(98, 242, 194, 0.055), transparent 38%),
    rgba(7, 15, 24, 0.88);
}

.breakdown-row--minion::before {
  content: '';
  position: absolute;
  left: 14px;
  top: -6px;
  bottom: -6px;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(98, 242, 194, 0.50), transparent);
}

.breakdown-row--minion .breakdown-row__header::before {
  content: '';
  position: absolute;
  left: 14px;
  top: 50%;
  width: 14px;
  border-top: 1px solid rgba(98, 242, 194, 0.55);
}

.breakdown-row__header {
  position: relative;
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(260px, 36vw) 190px;
  align-items: center;
  gap: 10px;
  height: 30px;
  min-height: 30px;
  padding: 3px 9px;
  cursor: pointer;
  user-select: none;
  overflow: hidden;
}

.breakdown-row__header::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  border-top: 10px solid var(--group-color, var(--ink-faint));
  border-right: 10px solid transparent;
  opacity: 0.95;
  z-index: 3;
}

.breakdown-row__bg-bar {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  opacity: 0.20;
  pointer-events: none;
  transition: width var(--transition-base);
  box-shadow: inset -18px 0 24px rgba(255, 255, 255, 0.10);
  background-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.12) 100%);
}

.breakdown-row__info {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  z-index: 1;
  min-width: 0;
  overflow: hidden;
}

.actor-name {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.breakdown-row__info strong,
.spell-row strong {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0;
}

.breakdown-row__metrics {
  position: relative;
  display: flex;
  align-items: center;
  display: grid;
  grid-template-columns: 82px 62px 46px;
  gap: 8px;
  justify-content: flex-end;
  z-index: 1;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}

.breakdown-row__val {
  color: var(--gold-glint);
  font-weight: 650;
  text-align: right;
  text-shadow: 0 0 12px rgba(244, 217, 128, 0.18);
}

.breakdown-row__sub {
  color: var(--ink-muted);
  font-size: 0.7rem;
  letter-spacing: 0.02em;
}

.breakdown-row__spells {
  position: relative;
  margin: 0 7px 7px 28px;
  padding: 6px 0 7px 18px;
  background:
    linear-gradient(90deg, rgba(98, 242, 194, 0.06), transparent 34%),
    rgba(6, 9, 20, 0.54);
  border: 1px solid rgba(98, 242, 194, 0.12);
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.breakdown-row__spells::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: linear-gradient(180deg, rgba(98, 242, 194, 0.12), rgba(98, 242, 194, 0.62), rgba(98, 242, 194, 0.12));
}

.spell-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(260px, 36vw) 160px;
  align-items: center;
  gap: 10px;
  font-size: var(--text-xs);
  min-height: 26px;
  padding: 3px 8px 3px 16px;
  border: 1px solid rgba(137, 171, 255, 0.08);
  border-radius: 7px;
  background: rgba(10, 16, 31, 0.62);
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
}

.spell-row::before {
  content: '';
  position: absolute;
  left: -11px;
  top: 50%;
  width: 11px;
  border-top: 1px solid rgba(98, 242, 194, 0.48);
}

.spell-row:hover {
  background: rgba(98, 242, 194, 0.09);
  border-color: rgba(98, 242, 194, 0.22);
}

.spell-row__link {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dotted rgba(244, 217, 128, 0.55);
}

.spell-row__link:hover,
.spell-row__link:focus {
  color: var(--gold-glint);
  outline: none;
  text-shadow: 0 0 10px rgba(244, 217, 128, 0.35);
}

.spell-row > .breakdown-row__spells {
  grid-column: 1 / -1;
  margin: 3px -2px 1px 14px;
  padding-left: 18px;
  background:
    linear-gradient(90deg, rgba(125, 92, 255, 0.08), transparent 40%),
    rgba(4, 7, 14, 0.58);
}

.spell-row--target {
  cursor: default;
  margin-left: 12px;
  border-color: rgba(125, 92, 255, 0.16);
  background: rgba(13, 11, 28, 0.72);
}

.spell-row--target::before {
  border-top-color: rgba(125, 92, 255, 0.55);
}

.combat-tooltip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  max-width: min(340px, calc(100vw - 24px));
  padding: 10px 12px;
  border: 1px solid rgba(244, 217, 128, 0.72);
  border-radius: 8px;
  background:
    radial-gradient(circle at 18% 0%, rgba(244, 217, 128, 0.18), transparent 34%),
    linear-gradient(135deg, rgba(17, 24, 39, 0.98), rgba(5, 7, 14, 0.97));
  box-shadow: 0 0 0 1px rgba(111, 69, 255, 0.32), 0 16px 42px rgba(0, 0, 0, 0.72), 0 0 24px rgba(111, 69, 255, 0.28);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.45;
  white-space: pre-line;
  pointer-events: none;
  opacity: 0;
  transform: translate3d(-999px, -999px, 0) scale(0.98);
  transition: opacity 80ms ease-out, transform 80ms ease-out;
}

.combat-tooltip--visible {
  opacity: 1;
  transform: translate3d(var(--tooltip-x), var(--tooltip-y), 0) scale(1);
}

.combat-tooltip::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(98, 242, 194, 0.13);
  border-radius: 5px;
  pointer-events: none;
}

.combat-tooltip__title {
  display: block;
  color: var(--gold-glint);
  font-family: var(--font-display);
  font-size: 0.88rem;
  letter-spacing: 0.03em;
  margin-bottom: 5px;
  text-shadow: 0 0 12px rgba(244, 217, 128, 0.35);
}

.combat-tooltip__body {
  color: var(--ink-muted);
}

.spell-bar-container {
  position: relative;
  height: 14px;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.055);
  border-radius: 999px;
  margin: 0 var(--space-4);
  overflow: hidden;
}

.spell-bar-container::after,
.metric-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent 48%, rgba(0, 0, 0, 0.12));
  pointer-events: none;
}

.spell-bar-fill {
  height: 100%;
  background: var(--spell-school-fill, linear-gradient(90deg, rgba(98, 242, 194, 0.70), var(--rune-violet), var(--gold-vein)));
  border-radius: inherit;
  box-shadow: 0 0 16px var(--spell-school-glow, rgba(125, 92, 255, 0.22));
}

.metric-bar {
  position: relative;
  height: 17px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.065);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16);
}

.metric-bar__fill {
  position: relative;
  z-index: 1;
  height: 100%;
  border-radius: inherit;
  background: var(--actor-color, var(--gold-vein));
  box-shadow: 0 0 18px rgba(244, 217, 128, 0.18);
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 6px;
  margin-top: var(--space-2);
}

.metric-card {
  padding: 8px;
  border: 1px solid var(--gridline);
  border-radius: 10px;
  background: rgba(6, 9, 20, 0.54);
}

.metric-card__label {
  display: block;
  color: var(--ink-faint);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.metric-card__value {
  display: block;
  margin-top: var(--space-1);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 600;
}

.death-card {
  background: var(--parchment);
  border: 1px solid rgba(196, 30, 58, 0.4);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-4);
  overflow: hidden;
}

.death-card__header {
  background: rgba(196, 30, 58, 0.15);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(196, 30, 58, 0.3);
}

.death-card__player {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-base);
}

.death-card__time {
  color: var(--gold-vein);
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}

.death-log {
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.death-log__entry {
  display: grid;
  grid-template-columns: 80px 1fr 140px 100px;
  gap: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
}

.death-log__entry:hover {
  background: var(--parchment-raised);
}

.death-log__entry--damage { color: #f87171; }
.death-log__entry--heal { color: #4ade80; }
.death-log__entry--killing-blow { color: #f43f5e; font-weight: 700; background: rgba(244, 63, 94, 0.2); }

.aura-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--space-4);
}

.aura-card {
  background: var(--parchment);
  border: 1px solid rgba(201, 168, 76, 0.2);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}

.aura-card__title {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--gold-glint);
  margin-bottom: var(--space-3);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.aura-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-2) 0;
  font-size: var(--text-sm);
  border-bottom: 1px dashed rgba(201, 168, 76, 0.1);
}

.aura-item:last-child {
  border-bottom: none;
}

.aura-count {
  font-family: var(--font-mono);
  color: var(--gold-vein);
}

.hidden { display: none !important; }

@media (max-width: 1024px) {
  body { grid-template-columns: 1fr; grid-template-rows: var(--header-h) 1fr; }
  .main { grid-row: 2; padding: var(--space-6) var(--space-4); animation: none; }
  .main::before { inset: var(--header-h) 0 0 0; }
  .fight-card { grid-template-columns: 1fr; }

  .track__events { left: 100px; }

@media (max-width: 640px) {

function parseDateTime(dateTime) {
  const dateTimeSeparatorIndex = dateTime.indexOf(' ');
  const date = dateTime.substr(0, dateTimeSeparatorIndex);
  const time = dateTime.substr(dateTimeSeparatorIndex + 1);

  const dateParts = date.split('/');
  const month = parseInt(dateParts[0], 10);
  const day = parseInt(dateParts[1], 10);
  const year = parseInt(dateParts[2], 10);

  const timeMatch = time.match(/^(\d{2}):(\d{2}):(\d{2})\.(\d{3})([+-]\d{1,2}(?::?\d{2})?)?$/);
  if (!timeMatch) throw new Error(`Invalid time format: ${time}`);

  const hour = parseInt(timeMatch[1], 10);
  const minute = parseInt(timeMatch[2], 10);
  const second = parseInt(timeMatch[3], 10);
  const millisecond = parseInt(timeMatch[4], 10);
  const tzOffset = timeMatch[5];

  const dateObj = new Date(Date.UTC(year, month - 1, day, hour, minute, second, millisecond));

  if (tzOffset) {
    const sign = tzOffset[0] === '-' ? -1 : 1;
    const offsetParts = tzOffset.substring(1).split(':');
    const offsetHours = parseInt(offsetParts[0], 10);
    const offsetMinutes = offsetParts[1] ? parseInt(offsetParts[1], 10) : 0;
    const totalOffsetMinutes = sign * (offsetHours * 60 + offsetMinutes);
    dateObj.setMinutes(dateObj.getMinutes() - totalOffsetMinutes);
  }

  return dateObj;
}

function splitLine(line) {
  const partSeparator = ',';
  const nestingCharacters = { '"': '"', '[': ']', '(': ')' };
  const parts = [];
  const lineLength = line.length;
  let currentPartStartIndex = 0;
  let nestingType = null;

  for (let i = 0; i < lineLength; i += 1) {
    const character = line[i];

    if (i === currentPartStartIndex && nestingCharacters[character] !== undefined) {
      nestingType = character;
    }

    if (character === partSeparator) {
      if (nestingType !== null) {
        const previousCharacter = line[i - 1];
        if (previousCharacter !== nestingCharacters[nestingType]) continue;
        const isEscaped = line[i - 2] === '\\';
        if (isEscaped) continue;
      }

      let partStartIndex = currentPartStartIndex;
      let partEndIndex = i;
      if (nestingType === '"') {
        partStartIndex += 1;
        partEndIndex -= 1;
      }
      const partLength = partEndIndex - partStartIndex;
      let part = line.substr(partStartIndex, partLength);
      if (nestingType === '"' && part.indexOf('\\') !== -1) {
        part = part.replace(/\\"/g, '"');
      }
      parts.push(part);

      currentPartStartIndex = i + partSeparator.length;
      nestingType = null;
    }
  }
  parts.push(line.substr(currentPartStartIndex));
  return parts;
}

function parseCombatantInfo(parts) {
  const firstComplexFieldIndex = parts.findIndex(part => part && (part.startsWith('[') || part.startsWith('(')));
  const specIdIndex = findCombatantSpecIdIndex(parts, firstComplexFieldIndex);
  let i = 0;
  const player = {
    playerId: parts[i++],
    strength: parseInt(parts[i++], 10),
    agility: parseInt(parts[i++], 10),
    stamina: parseInt(parts[i++], 10),
    intellect: parseInt(parts[i++], 10),
    dodge: parseInt(parts[i++], 10),
    parry: parseInt(parts[i++], 10),
    block: parseInt(parts[i++], 10),
    critMelee: parseInt(parts[i++], 10),
    critRanged: parseInt(parts[i++], 10),
    critSpell: parseInt(parts[i++], 10),
    speed: parseInt(parts[i++], 10),
    leech: parseInt(parts[i++], 10),
    hasteMelee: parseInt(parts[i++], 10),
    hasteRanged: parseInt(parts[i++], 10),
    hasteSpell: parseInt(parts[i++], 10),
    avoidance: parseInt(parts[i++], 10),
    mastery: parseInt(parts[i++], 10),
    versatilityDamageDone: parseInt(parts[i++], 10),
    versatilityHealingDone: parseInt(parts[i++], 10),
    versatilityDamageReduction: parseInt(parts[i++], 10),
    armor: parseInt(parts[i++], 10),
    specId: parseInt(parts[specIdIndex], 10) || 0,
    talents: parts[i++],
    pvpTalents: parts[i++],
    traits: parts[i++],
    gear: parts[i++],
    buffs: parts[i++]
  };
  i = specIdIndex + 1;
  player.talents = parts[i++];
  player.pvpTalents = parts[i++];
  player.traits = parts[i++];
  player.gear = parts[i++];
  player.buffs = parts[i++];
  player.classKey = SPEC_TO_CLASS[player.specId] || null;
  player.specName = SPEC_NAMES[player.specId] || `Spec ${player.specId}`;
  return player;
}

function findCombatantSpecIdIndex(parts, firstComplexFieldIndex) {
  const fallbackIndex = firstComplexFieldIndex > 0 ? firstComplexFieldIndex - 1 : 25;
  const start = firstComplexFieldIndex > 0 ? Math.max(1, firstComplexFieldIndex - 6) : 1;
  const end = firstComplexFieldIndex > 0 ? firstComplexFieldIndex : Math.min(parts.length, 32);
  for (let index = end - 1; index >= start; index--) {
    const specId = parseInt(parts[index], 10) || 0;
    if (SPEC_TO_CLASS[specId]) return index;
  }
  return fallbackIndex;
}

function parseCombatLogFields(rawEventParams) {
  const parts = Array.isArray(rawEventParams) ? rawEventParams : splitLine(rawEventParams);
  const hasHideCaster = !isGuidLike(parts[0]) && isGuidLike(parts[1]);
  const offset = hasHideCaster ? 1 : 0;
  return {
    parts,
    hideCaster: hasHideCaster ? parts[0] : null,
    sourceGuid: parts[offset] || '',
    sourceName: parts[offset + 1] || '',
    sourceFlags: Number(parts[offset + 2]) || 0,
    sourceRaidFlags: Number(parts[offset + 3]) || 0,
    destGuid: parts[offset + 4] || '',
    destName: parts[offset + 5] || '',
    destFlags: Number(parts[offset + 6]) || 0,
    destRaidFlags: Number(parts[offset + 7]) || 0,
    payload: parts.slice(offset + 8)
  };
}

function isGuidLike(value) {
  if (!value) return false;
  return value === '0000000000000000' || value === '0x0000000000000000' || /^[A-Za-z]+-[\w-]+$/.test(value);
}

function handleDirectoryFiles(fileList) {
  const selectedFiles = Array.from(fileList);

    .filter(file => /^WoWCombatLog(?:-.+)?\.txt$/i.test(file.name))
    .sort((a, b) => getFileSortPath(a).localeCompare(getFileSortPath(b), undefined, { numeric: true }));
  const ignoredCount = selectedFiles.length - files.length;
  setUploadStatus(`Using ${files.length.toLocaleString()} WoW combat log files; ignored ${ignoredCount.toLocaleString()} other files.`);
  if (files.length === 0) return;

function setImportProgress(title, current, total, detail = '') {
  const pct = total > 0 ? Math.max(0, Math.min(100, (current / total) * 100)) : 0;
  const message = `${title}: ${Math.round(pct)}%${detail ? ` · ${detail}` : ''}`;
  setUploadStatus(message);
  if (!fightList) return;
  fightList.innerHTML = `<div class="import-progress" role="status" aria-live="polite">
    <div class="import-progress__title">${escapeHtml(title)}</div>
    <div class="import-progress__bar" aria-hidden="true"><div class="import-progress__fill" style="--progress: ${pct.toFixed(1)}%;"></div></div>
    <div class="import-progress__meta">${escapeHtml(`${Math.round(pct)}%${detail ? ` · ${detail}` : ''}`)}</div>
  </div>`;
}

function nextFrame() {
  return new Promise(resolve => requestAnimationFrame(() => resolve()));
}

async function parseLogFile(file) {
  try {
    setImportProgress('Reading combat log', 0, file.size || 1, file.name);
    const text = await readFileText(file, event => {
      if (event.lengthComputable) setImportProgress('Reading combat log', event.loaded, event.total, file.name);
    });
    setImportProgress('Parsing combat log', 1, 1, `${formatNumber(text.length)} characters`);
    await nextFrame();
    persistCurrentLog(text);
    loadLogText(text);
  } catch (err) {
    console.error('File read error:', err);
    setImportProgress('Could not read combat log', 0, 1, err.message || String(err));
  }
}

async function parseLogFiles(files) {
  try {
    const totalBytes = files.reduce((sum, file) => sum + (file.size || 0), 0) || files.length;
    let completedBytes = 0;
    resetLogState([]);
    for (let index = 0; index < files.length; index += 1) {
      const file = files[index];
      let lastLoaded = 0;
      const label = `${index + 1}/${files.length} ${file.name}`;
      setImportProgress('Reading combat log directory', completedBytes, totalBytes, label);
      const text = await readFileText(file, event => {
        if (!event.lengthComputable) return;
        lastLoaded = event.loaded;
        setImportProgress('Reading combat log directory', completedBytes + lastLoaded, totalBytes, label);
      });
      completedBytes += file.size || lastLoaded || 1;
      const nextLines = text.split('\n');
      if (state.rawLines.length > 0 && state.rawLines[state.rawLines.length - 1] !== '') state.rawLines.push('');
      nextLines.forEach(line => state.rawLines.push(line));
      setImportProgress('Reading combat log directory', completedBytes, totalBytes, `${label} · ${formatNumber(state.rawLines.length)} lines`);
      await nextFrame();
    }
    setImportProgress('Parsing combat log directory', 1, 1, `${files.length} files · ${formatNumber(state.rawLines.length)} lines`);
    await nextFrame();
    finishLoadedLog();
  } catch (err) {
    console.error('Directory read error:', err);
    setImportProgress('Could not read directory', 0, 1, err.message || String(err));
  }
}

function readFileText(file, onProgress = null) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    if (onProgress) reader.onprogress = onProgress;
    reader.onload = (e) => resolve(e.target.result || '');
    reader.onerror = () => reject(reader.error || new Error(`Could not read ${file.name}`));
    reader.readAsText(file);
  });
}

function loadLogText(text) {
  resetLogState(text.split('\n'));
  finishLoadedLog();
}

function resetLogState(rawLines) {
  state = {
    fights: [],
    players: new Map(),
    events: [],
    currentFight: null,
    selectedSourceGuid: null,
    selectedSpellKey: null,

    expandedActorGroups: new Set(),
    selectedFightPanel: 'summary',
    actorFilter: state.actorFilter || 'all',
    petOwners: new Map(),
    playerNames: new Map(),
    rawLines
  };
}

}

function persistCurrentLog(text) {
  openLogDatabase()
    .then(db => putStoredLog(db, text))
    .catch(err => console.warn('Could not persist combat log.', err));
}

function restorePersistedLog() {
  openLogDatabase()
    .then(db => getStoredLog(db))
    .then(text => {
      if (!text) return;
      uploadZone.classList.add('hidden');
      fightList.classList.remove('hidden');
      switchTab('fights');
      loadLogText(text);
    })
    .catch(err => console.warn('Could not restore persisted combat log.', err));
}

function openLogDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(LOG_DB_NAME, 2);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(LOG_STORE_NAME)) db.createObjectStore(LOG_STORE_NAME);
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function putStoredLog(db, text) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(LOG_STORE_NAME, 'readwrite');
    tx.objectStore(LOG_STORE_NAME).put(text, STORED_LOG_KEY);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function getStoredLog(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(LOG_STORE_NAME, 'readonly');
    const request = tx.objectStore(LOG_STORE_NAME).get(STORED_LOG_KEY);
    request.onsuccess = () => resolve(request.result || '');
    request.onerror = () => reject(request.error);
  });
}

function parseRawLines() {
  const COMBAT_GAP_THRESHOLD = 12000;
  const MIN_FIGHT_DURATION = 5000;
  const MAX_FIGHT_DURATION = 5 * 60 * 1000;
  const fights = [];
  let currentFightStart = null;

  const encounterFights = [];
  const combatEvents = [];

  state.rawLines.forEach((line, lineNo) => {
    if (!line.trim()) return;
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) return;
    const rawDateTime = line.substr(0, timeEndIndex);
    const event = line.substr(timeEndIndex + 2);
    const eventNameEndIndex = event.indexOf(',');
    if (eventNameEndIndex === -1) return;
    const eventName = event.substr(0, eventNameEndIndex);
    const rawEventParams = event.substr(eventNameEndIndex + 1);

    if (eventName === 'ENCOUNTER_START') {
      const parts = splitLine(rawEventParams);
      currentFightStart = {
        lineNo,
        dateTime: parseDateTime(rawDateTime),
        event: parts
      };
    } else if (eventName === 'ENCOUNTER_END' && currentFightStart) {
      const parts = splitLine(rawEventParams);
      const bossId = Number(parts[0]);
      const bossName = parts[1];
      const difficulty = Number(parts[2]);
      const kill = parts[4] == '1';

      const isSameFight = currentFightStart.event[0] === parts[0] &&
                          currentFightStart.event[1] === parts[1] &&
                          currentFightStart.event[2] === parts[2];

      if (isSameFight) {
        const endDateTime = parseDateTime(rawDateTime);
        const duration = endDateTime - currentFightStart.dateTime;
        encounterFights.push({
          startLineNo: currentFightStart.lineNo,
          endLineNo: lineNo,
          startDateTime: currentFightStart.dateTime,
          endDateTime,
          bossId,
          bossName,
          difficulty,
          kill,
          duration
        });
      }
      currentFightStart = null;
    }

    if (isCombatBoundaryEvent(eventName)) {
      const fields = parseCombatLogFields(rawEventParams);
      combatEvents.push({
        lineNo,
        dateTime: parseDateTime(rawDateTime),
        eventName,
        sourceId: fields.sourceGuid,
        destId: fields.destGuid
      });
    }
  });

  if (encounterFights.length > 0) {
    fights.push(...encounterFights);
  }

  const timeGapFights = buildTimeGapFights(combatEvents, fights.length + 1, COMBAT_GAP_THRESHOLD, MIN_FIGHT_DURATION, MAX_FIGHT_DURATION);

  for (const gf of timeGapFights) {
    const overlapsEncounter = fights.some(f => gf.startLineNo <= f.endLineNo && gf.endLineNo >= f.startLineNo);
    if (!overlapsEncounter) fights.push(gf);
  }

  fights.sort((a, b) => a.startLineNo - b.startLineNo);
  state.fights = fights;
  parseAllEvents();
}

function isCombatBoundaryEvent(eventName) {
  if (eventName === 'COMBAT_LOG_VERSION' || eventName === 'COMBATANT_INFO') return false;
  if (eventName === 'SPELL_CAST_SUCCESS' || eventName === 'SPELL_AURA_APPLIED' || eventName === 'SPELL_AURA_REMOVED') return false;
  return eventName.includes('_DAMAGE') ||
    eventName.includes('_HEAL') ||
    eventName.includes('_MISSED') ||
    eventName === 'SWING_DAMAGE' ||
    eventName === 'SWING_MISSED' ||
    eventName === 'RANGE_DAMAGE' ||
    eventName === 'RANGE_MISSED' ||
    eventName === 'UNIT_DIED' ||
    eventName === 'PARTY_KILL';
}

function buildTimeGapFights(combatEvents, startIndex, gapThreshold, minDuration, maxDuration) {
  const fights = [];
  if (combatEvents.length < 2) return fights;

  let segStart = combatEvents[0];
  let previous = combatEvents[0];

  for (let i = 1; i < combatEvents.length; i++) {
    const current = combatEvents[i];
    const gap = current.dateTime - previous.dateTime;
    if (gap > gapThreshold) {
      addTimeGapFight(fights, segStart, previous, startIndex, minDuration, maxDuration);
      segStart = current;
    }
    previous = current;
  }

  addTimeGapFight(fights, segStart, previous, startIndex, minDuration, maxDuration);
  return fights;
}

function addTimeGapFight(fights, startEvent, endEvent, startIndex, minDuration, maxDuration) {
  const duration = endEvent.dateTime - startEvent.dateTime;
  if (duration < minDuration) return;

  if (duration > maxDuration) {
    addChunkedTimeGapFights(fights, startEvent, endEvent, startIndex, minDuration, maxDuration);
    return;
  }

  fights.push({
    startLineNo: startEvent.lineNo,
    endLineNo: endEvent.lineNo,
    startDateTime: startEvent.dateTime,
    endDateTime: endEvent.dateTime,
    bossId: 0,
    bossName: `Fight ${startIndex + fights.length}`,
    difficulty: 0,
    kill: false,
    duration
  });
}

function addChunkedTimeGapFights(fights, startEvent, endEvent, startIndex, minDuration, maxDuration) {
  let chunkStart = startEvent;
  while (chunkStart.dateTime < endEvent.dateTime) {
    const chunkEndTime = new Date(Math.min(chunkStart.dateTime.getTime() + maxDuration, endEvent.dateTime.getTime()));
    const chunkEnd = {
      ...endEvent,
      lineNo: findLastCombatEventLineAtOrBefore(chunkEndTime, chunkStart.lineNo, endEvent.lineNo),
      dateTime: chunkEndTime
    };
    if (chunkEnd.lineNo <= chunkStart.lineNo) break;
    addTimeGapFight(fights, chunkStart, chunkEnd, startIndex, minDuration, maxDuration);
    chunkStart = {
      ...chunkEnd,
      lineNo: chunkEnd.lineNo + 1,
      dateTime: chunkEndTime
    };
  }
}

function findLastCombatEventLineAtOrBefore(dateTime, startLineNo, endLineNo) {
  let bestLineNo = startLineNo;
  for (let lineNo = startLineNo; lineNo <= endLineNo && lineNo < state.rawLines.length; lineNo++) {
    const line = state.rawLines[lineNo];
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) continue;
    if (parseDateTime(line.substr(0, timeEndIndex)) <= dateTime) bestLineNo = lineNo;
    else break;
  }
  return bestLineNo;
}

function parseAllEvents() {
  const players = new Map();
  const events = [];
  const playerGUIDs = new Set();
  const inferredPlayerClassVotes = new Map();
  const petOwners = new Map();
  const playerNames = new Map();

  state.rawLines.forEach((line, lineNo) => {
    if (!line.trim()) return;
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) return;
    const rawDateTime = line.substr(0, timeEndIndex);
    const event = line.substr(timeEndIndex + 2);
    const eventNameEndIndex = event.indexOf(',');
    if (eventNameEndIndex === -1) return;
    const eventName = event.substr(0, eventNameEndIndex);
    const rawEventParams = event.substr(eventNameEndIndex + 1);

    if (eventName === 'COMBATANT_INFO') {
      const parts = splitLine(rawEventParams);
      try {
        const player = parseCombatantInfo(parts);
        players.set(player.playerId, player);
      } catch (e) {
        console.error('COMBATANT_INFO parse error at line', lineNo, e);
      }
    }

    // Collect GUIDs from all events where source/dest fields exist and start with 'Player-'
    const fields = parseCombatLogFields(rawEventParams);
    const parts = fields.parts;
    if (parts.length >= 5) {
      const sourceId = fields.sourceGuid;
      const destId = fields.destGuid;
      if (sourceId && sourceId.startsWith('Player-')) {
        playerGUIDs.add(sourceId);
        rememberPlayerName(playerNames, sourceId, fields.sourceName);
      }
      if (destId && destId.startsWith('Player-')) {
        playerGUIDs.add(destId);
        rememberPlayerName(playerNames, destId, fields.destName);
      }
      const spellId = eventHasSpellIdPayload(eventName) ? parseInt(fields.payload[0], 10) || 0 : 0;
      if (sourceId && sourceId.startsWith('Player-') && spellId && SPELL_CLASS_HINTS[spellId]) {
        addPlayerClassVote(inferredPlayerClassVotes, sourceId, SPELL_CLASS_HINTS[spellId], spellId);
      }
      if (eventName === 'SPELL_SUMMON' && sourceId && sourceId.startsWith('Player-') && destId && !destId.startsWith('Player-')) {
        petOwners.set(destId, sourceId);
      }
      rememberAdvancedUnitOwners(petOwners, fields.payload);
    }

    events.push({
      lineNo,
      rawDateTime,
      type: eventName,
      params: rawEventParams
    });
  });

  for (const guid of playerGUIDs) {
    if (!players.has(guid)) {
      const inferredClass = getBestInferredPlayerClass(inferredPlayerClassVotes, guid);
      players.set(guid, {
        playerId: guid,
        specId: 0,
        classKey: inferredClass,
        specName: getDisplayName(playerNames.get(guid), guid),
        strength: 0, agility: 0, stamina: 0, intellect: 0,
        dodge: 0, parry: 0, block: 0,
        critMelee: 0, critRanged: 0, critSpell: 0,
        speed: 0, leech: 0,
        hasteMelee: 0, hasteRanged: 0, hasteSpell: 0,
        avoidance: 0, mastery: 0,
        versatilityDamageDone: 0, versatilityHealingDone: 0, versatilityDamageReduction: 0,
        armor: 0
      });
    } else if (!players.get(guid).classKey) {
      players.get(guid).classKey = getBestInferredPlayerClass(inferredPlayerClassVotes, guid);
    }
  }

  state.players = players;
  state.events = events;
  state.petOwners = petOwners;
  state.playerNames = playerNames;
}

function rememberAdvancedUnitOwners(petOwners, payload) {
  for (let index = 0; index < payload.length - 1; index += 1) {
    const unitGuid = payload[index];
    const ownerGuid = payload[index + 1];
    if (isPlayerGuid(ownerGuid) && isValidActorGuid(unitGuid) && !isPlayerGuid(unitGuid)) {
      petOwners.set(unitGuid, ownerGuid);
    }
  }
}

function renderFightList() {
  const fightsWithPlayers = state.fights
    .map((fight, index) => ({ fight, index, players: getFightPlayerRows(fight) }))
    .filter(item => item.players.length > 0)
    .sort((a, b) => (b.fight.startDateTime?.getTime?.() || 0) - (a.fight.startDateTime?.getTime?.() || 0) || b.index - a.index);

  if (fightsWithPlayers.length === 0) {
    fightList.innerHTML = `
      <div class="empty-state">
        <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <h3 class="empty-state__title">No Player Fights Found</h3>
        <p class="empty-state__desc">No detected fight windows contain player combat activity.</p>
      </div >
    `;
    return;
  }

  fightList.innerHTML = fightsWithPlayers.map(({ fight, index, players }) => {

function getMetaFight() {
  if (state.fights.length === 0) return null;
  return {
    startLineNo: state.fights.reduce((min, f) => Math.min(min, f.startLineNo), Infinity),
    endLineNo: state.fights.reduce((max, f) => Math.max(max, f.endLineNo), -Infinity),
    startDateTime: state.fights[0].startDateTime,
    endDateTime: state.fights[state.fights.length - 1].endDateTime,
    duration: state.fights.reduce((sum, f) => sum + f.duration, 0),
    bossName: 'All Fights',
    bossId: 0,
    difficulty: 0,
    kill: state.fights.some(f => f.kill)
  };
}

function renderOverallSummaryContent(fight) {

      <div class="overall-hero__stat"><span class="overall-hero__label">Total Healing</span><span class="overall-hero__value">${formatNumber(totalHealing)}</span><span class="overall-hero__sub">${formatNumber(Math.round(totalHealing / totalSeconds))} HPS</span></div>
      <div class="overall-hero__stat"><span class="overall-hero__label">Fights</span><span class="overall-hero__value">${state.fights.length}</span><span class="overall-hero__sub">${state.fights.filter(f => f.kill).length} kills</span></div>

function getFightCardStats(fight, players) {
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const totalDamage = players.reduce((sum, player) => sum + player.amount, 0);
  const eventCount = state.events.filter(event => event.lineNo >= fight.startLineNo && event.lineNo <= fight.endLineNo).length;
  return {
    totalDamage,
    fightDps: Math.round(totalDamage / fightSeconds),
    eventCount,
    eventsPerSecond: eventCount / fightSeconds,
    durationPct: Math.min(100, (fight.duration / (5 * 60 * 1000)) * 100),
    activityPct: Math.min(100, (eventCount / fightSeconds / 12) * 100),
    topShare: totalDamage > 0 && players[0] ? (players[0].amount / totalDamage) * 100 : 0,
    friendlyCount: players.filter(player => player.faction === 'friendly').length,
    hostileCount: players.filter(player => player.faction === 'hostile').length,
    unknownCount: players.filter(player => player.faction !== 'friendly' && player.faction !== 'hostile').length
  };
}

function getFightPlayerRows(fight) {
  return buildDamageDoneRows(fight)
    .filter(row => row.guid && row.guid.startsWith('Player-'))
    .sort((a, b) => b.amount - a.amount);
}

function renderFightPlayerChips(players) {
  const visiblePlayers = players.slice(0, 12);
  const hiddenCount = Math.max(0, players.length - visiblePlayers.length);
  const chips = visiblePlayers.map(player => {
    const color = getPlayerClassColor(player.guid);
    const factionClass = player.faction === 'hostile' ? 'fight-card__player--hostile' : (player.faction === 'friendly' ? 'fight-card__player--friendly' : '');
    return `<span class="fight-card__player ${factionClass}" style="--player-color: ${color};" title="${escapeHtml(player.name)}">${escapeHtml(formatActorDisplayName(player.name))}</span>`;
  });
  if (hiddenCount > 0) chips.push(`<span class="fight-card__player fight-card__player--more">+${hiddenCount}</span>`);
  if (chips.length === 0) chips.push(`<span class="fight-card__player fight-card__player--more">none</span>`);
  return `<div class="fight-card__team"><span class="fight-card__team-label">Players</span><span class="fight-card__team-list">${chips.join('')}</span></div>`;
}

function renderFightTeamRow(label, players) {
  const visiblePlayers = players.slice(0, 10);
  const hiddenCount = Math.max(0, players.length - visiblePlayers.length);
  const chips = visiblePlayers.map(player => {
    const color = getPlayerClassColor(player.guid);
    return `<span class="fight-card__player" style="--player-color: ${color};" title="${escapeHtml(player.name)}">${escapeHtml(formatActorDisplayName(player.name))}</span>`;
  });
  if (hiddenCount > 0) chips.push(`<span class="fight-card__player fight-card__player--more">+${hiddenCount}</span>`);
  if (chips.length === 0) chips.push(`<span class="fight-card__player fight-card__player--more">none</span>`);
  return `<div class="fight-card__team"><span class="fight-card__team-label">${label}</span><span class="fight-card__team-list">${chips.join('')}</span></div>`;
}

function renderActorName(name, guid, className = '', ownerGuid = null) {
  ownerGuid = ownerGuid || state.petOwners.get(guid) || null;
  const classGuid = isPlayerGuid(guid) ? guid : ownerGuid;
  const color = classGuid ? getPlayerClassColor(classGuid) : 'var(--ink-muted)';
  const classKey = classGuid ? getPlayerClassKey(classGuid) : null;
  const title = classKey ? `${name}\n${classKey} · ${guid}` : `${name}\nUnknown class · ${guid}`;
  return `<strong class="actor-name ${className}" style="color: ${color}; --player-color: ${color};" title="${escapeHtml(title)}">${escapeHtml(formatActorDisplayName(name))}</strong>`;
}

function formatActorDisplayName(name) {
  return String(name || '').replace(/-([A-Z]{2})$/i, '');
}

function getPlayerClassColor(guid) {
  const classKey = getPlayerClassKey(guid);
  return CLASS_COLORS[classKey] || '#94A3B8';
}

function getActorClassColor(guid, ownerGuid = null) {
  const classGuid = isPlayerGuid(guid) ? guid : ownerGuid || state.petOwners.get(guid) || null;
  return classGuid ? getPlayerClassColor(classGuid) : '#94A3B8';
}

function getPlayerClassKey(guid) {
  const player = state.players.get(guid);
  if (!player) return null;
  return normalizeClassKey(player.classKey) || SPEC_TO_CLASS[player.specId] || null;
}

function normalizeClassKey(className) {
  const normalized = String(className || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (CLASS_ALIASES[normalized]) return CLASS_ALIASES[normalized];
  return CLASS_COLORS[normalized] ? normalized : null;
}

function formatClassName(classKey) {
  if (classKey === 'DEATHKNIGHT') return 'Death Knight';
  if (classKey === 'DEMONHUNTER') return 'Demon Hunter';
  return String(classKey || '').toLowerCase().replace(/^[a-z]/, letter => letter.toUpperCase());
}

function getReactionGroup(flags) {
  if ((flags & COMBATLOG_REACTION_FRIENDLY) === COMBATLOG_REACTION_FRIENDLY) return 'friendly';
  if ((flags & COMBATLOG_REACTION_HOSTILE) === COMBATLOG_REACTION_HOSTILE) return 'hostile';
  return 'unknown';
}

function rememberPlayerName(playerNames, guid, name) {
  const cleaned = cleanActorName(name);
  if (guid && guid.startsWith('Player-') && cleaned) playerNames.set(guid, cleaned);
}

function eventHasSpellIdPayload(eventName) {
  return eventName.startsWith('SPELL_') || eventName.startsWith('RANGE_');
}

function addPlayerClassVote(votesByGuid, guid, classKey, spellId) {
  if (!classKey) return;
  if (!votesByGuid.has(guid)) votesByGuid.set(guid, new Map());
  const votes = votesByGuid.get(guid);
  if (!votes.has(classKey)) votes.set(classKey, new Set());
  votes.get(classKey).add(spellId);
}

function getBestInferredPlayerClass(votesByGuid, guid) {
  const votes = votesByGuid.get(guid);
  if (!votes) return null;
  const ranked = Array.from(votes.entries()).map(([classKey, spellIds]) => [classKey, spellIds.size]).sort((a, b) => b[1] - a[1]);
  if (ranked.length === 0) return null;
  const [classKey, score] = ranked[0];
  const nextScore = ranked[1]?.[1] || 0;
  if (score < 1 || score === nextScore) return null;
  return classKey;
}

function renderTimeline() {
  timelineTracksEl.innerHTML = '';
  bossHpEl.innerHTML = '';
  phaseLabelsEl.innerHTML = '';

  if (state.fights.length === 0) return;

  const fight = state.currentFight || state.fights[0];
  if (!fight) return;

  // Boss HP Bar
  const bossHpRatio = 100; // Assuming full health for simplification here
  bossHpEl.innerHTML = `<div class="timeline__hp-bar" style="width: ${bossHpRatio}%"></div>`;

  // Phases
  const phases = ['Phase 1', 'Phase 2', 'Phase 3']; // Example phases
  phases.forEach((phase, index) => {
    phaseLabelsEl.innerHTML += `<span class="timeline__phase-labels__label">${phase}</span>`;
    bossHpEl.innerHTML += `<div class="timeline__hp-phase" style="left: ${Math.floor(index / (phases.length - 1) * 100)}%; animation-delay: ${index * 0.3}s;"></div>`;
  });

  const fightEvents = state.events
    .filter(e => e.lineNo >= fight.startLineNo && e.lineNo <= fight.endLineNo && isCombatBoundaryEvent(e.type))
    .slice(0, 250);

  const fragment = document.createDocumentFragment();
  fightEvents.forEach(event => {
    const { lineNo, rawDateTime, type, params } = event;
    const dt = parseDateTime(rawDateTime);
    
    // Simplified timeline positioning based on time relative to fight start
    const fightStart = fight.startDateTime;
    const totalDurationMs = fight.duration;
    const timeOffsetMs = dt - fightStart;
    const positionPercent = totalDurationMs > 0 ? Math.max(0, Math.min(100, (timeOffsetMs / totalDurationMs) * 100)) : 0;

    const trackDiv = document.createElement('div');
    trackDiv.className = 'track';
    
    let trackName = type;
    let trackSpec = '';
    let classColor = 'var(--ink-muted)';
    
    if (type.includes('DAMAGE')) { classColor = CLASS_COLORS.WARRIOR; trackName = 'Damage'; }
    if (type.includes('HEAL')) { classColor = CLASS_COLORS.PRIEST; trackName = 'Heal'; }
    if (type.includes('SPELL')) { classColor = '#fbbf24'; trackName = 'Spell'; }

    trackDiv.innerHTML = `
      <div class="track__label">${trackName}</div>
      <div class="track__events" style="left: ${positionPercent}%;">
        <div class="event event--${type.toLowerCase().includes('damage') ? 'damage' : type.toLowerCase().includes('heal') ? 'heal' : 'mechanic'}" 
             style="left: 0%; top: 50%; transform: translateY(-50%) scale(1); z-index: 5;" 
             title="${rawDateTime}">
        </div>
      </div>
    `;
    fragment.appendChild(trackDiv);
  });
  timelineTracksEl.appendChild(fragment);
}

function renderRawLog() {
  if (state.rawLines.length === 0) {
    rawLogContent.innerHTML = '<p class="empty-state__desc">No log lines found.</p>';
    document.getElementById('raw-line-count').textContent = '0 lines';
    return;
  }

  const fight = state.currentFight;
  const fightLines = fight ? state.rawLines.slice(fight.startLineNo, fight.endLineNo + 1) : [];
  const visibleLines = fight
    ? fightLines.slice(0, 3000)
    : state.rawLines.slice(0, 1000);
  const hiddenCount = fight ? Math.max(0, fightLines.length - visibleLines.length) : Math.max(0, state.rawLines.length - visibleLines.length);
  let html = '';
  visibleLines.forEach((line, index) => {
    const lineNo = fight ? fight.startLineNo + index : index;
    if (!line.trim()) return;
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) return;
    const rawDateTime = line.substr(0, timeEndIndex);
    const event = line.substr(timeEndIndex + 2);
    const eventNameEndIndex = event.indexOf(',');
    if (eventNameEndIndex === -1) return;
    const eventName = event.substr(0, eventNameEndIndex);
    const rawEventParams = event.substr(eventNameEndIndex + 1);

    let lineClass = '';
    if (eventName === 'ENCOUNTER_START' || eventName === 'ENCOUNTER_END') lineClass = 'raw-log__event';
    if (eventName === 'COMBATANT_INFO') lineClass = 'raw-log__event';

    html += `<div class="raw-log__line ${lineClass}">
      <span class="raw-log__timestamp">${rawDateTime}</span>
      <span class="raw-log__event">${eventName}:</span>
      <span class="raw-log__params">${rawEventParams}</span>
    </div>`;
  });

  if (hiddenCount > 0) {
    html += `<div class="raw-log__line raw-log__line--highlight">Showing ${visibleLines.length.toLocaleString()} lines. ${hiddenCount.toLocaleString()} more hidden to keep the page responsive.</div>`;
  }

  rawLogContent.innerHTML = html;
  document.getElementById('raw-line-count').textContent = `${state.rawLines.length} lines`;
}

  const dispelRows = filterActorRows(buildEventCountRows(fight, ['SPELL_DISPEL', 'SPELL_STOLEN', 'SPELL_DISPEL_FAILED']));
  const resourceRows = filterActorRows(buildEventCountRows(fight, ['ENERGIZE', 'DRAIN', 'LEECH']));

  return `<div class="breakdown-controls">

      ${renderReportPanel('Damage Done', damageDoneRows, fight, true)}
      ${renderReportPanel('Damage Taken', damageTakenRows, fight, true)}
      ${renderReportPanel('Healing Done', healingDoneRows, fight, true)}
      ${renderReportPanel('Healing Taken', healingTakenRows, fight, true)}
      ${renderReportPanel('Threat', threatRows, fight, false, 'events')}
      ${renderReportPanel('Casts', castRows, fight, false, 'casts')}
      ${renderReportPanel('Buffs', buffRows, fight, false, 'applications')}
      ${renderReportPanel('Debuffs', debuffRows, fight, false, 'applications')}
      ${renderReportPanel('Deaths', deathRows, fight, false, 'events')}
      ${renderReportPanel('Interrupts', interruptRows, fight, false, 'casts')}
      ${renderReportPanel('Dispels', dispelRows, fight, false, 'casts')}
      ${renderReportPanel('Resources', resourceRows, fight, false, 'events')}
    </div>`;
}

function renderSingleReportContent(title, rows, fight) {
  const interactive = ['Damage Done', 'Damage Taken', 'Healing Done', 'Healing Taken'].includes(title);
  return `<div class="breakdown-controls">
      <button class="filter-btn filter-btn--active">${escapeHtml(title)}</button>
      <span class="breakdown-row__sub">${escapeHtml(fight.bossName)} · ${formatDuration(fight.duration)}</span>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat Log Parser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink-well: #060914;
  --parchment: #0d1426;
  --parchment-raised: #141f36;
  --gold-vein: #ffb14a;
  --gold-glint: #ffd08a;
  --ink: #eef4ff;
  --ink-muted: #aab7cf;
  --ink-faint: #647089;
  --gridline: rgba(137, 171, 255, 0.12);
  --void-blue: #0a1020;
  --rune-violet: #7d5cff;
  --healer-mint: #62f2c2;
  --wipe-red: #ff5b6e;

  --class-warrior: #c69b6d;
  --class-paladin: #f48cba;
  --class-hunter: #aad372;
  --class-rogue: #fff468;
  --class-priest: #ffffff;
  --class-dk: #c41e3a;
  --class-shaman: #0070dd;
  --class-mage: #3fc7eb;
  --class-warlock: #8788ee;
  --class-monk: #00ff98;
  --class-dh: #a330c9;
  --class-evoker: #33937f;

  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Inter Tight', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Fira Code', monospace;

  --text-xs: 0.7rem;
  --text-sm: 0.8125rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: clamp(1.75rem, 1.5rem + 1.25vw, 2.5rem);
  --text-3xl: clamp(2.25rem, 1.75rem + 2.5vw, 3.5rem);

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 10px;

  --transition-fast: 120ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 350ms ease;

  --header-h: 64px;
  --sidebar-w: 220px;
}

@media (prefers-reduced-motion: reduce) {
:root {
  --transition-fast: 0ms;
  --transition-base: 0ms;
  --transition-slow: 0ms;
}
*, *::before, *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 12%, rgba(125, 92, 255, 0.22), transparent 26rem),
    radial-gradient(circle at 88% 18%, rgba(255, 177, 74, 0.13), transparent 24rem),
    linear-gradient(180deg, #070b17 0%, #050713 100%);
  min-height: 100vh;
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: var(--sidebar-w) 1fr;
  letter-spacing: -0.01em;
}

::-webkit-scrollbar { width: 8px; height: 8px; }

::-webkit-scrollbar-track { background: var(--ink-well); }

::-webkit-scrollbar-thumb { background: var(--parchment-raised); border-radius: 4px; border: 2px solid var(--ink-well); }

::-webkit-scrollbar-thumb:hover { background: var(--gold-vein); }

.header {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-6);
  background: rgba(6, 9, 20, 0.82);
  border-bottom: 1px solid var(--gridline);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 100;
  animation: slideDown var(--transition-slow) ease-out;
}

@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.header__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--ink);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.header__title::before {
  content: 'BLACKBOX / ';
  color: var(--gold-vein);
}

.header__actions { display: flex; gap: var(--space-3); align-items: center; }

.sidebar {
  grid-column: 1;
  grid-row: 2;
  background: linear-gradient(180deg, rgba(13, 20, 38, 0.92), rgba(6, 9, 20, 0.92));
  border-right: 1px solid var(--gridline);
  padding: var(--space-6) var(--space-4);
  overflow-y: auto;
  animation: slideInLeft var(--transition-slow) ease-out var(--space-2) both;
}

@keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.nav { display: flex; flex-direction: column; gap: var(--space-1); }

.nav__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border: none;
  background: transparent;
  color: var(--ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  text-align: left;
  width: 100%;
  border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.nav__item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 100%;
  background: linear-gradient(90deg, rgba(255, 177, 74, 0.22), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--transition-base);
}

.nav__item:hover { color: var(--ink); background: rgba(125, 92, 255, 0.12); }

.nav__item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-vein); }

.nav__item[aria-selected="true"] {
  color: var(--ink);
  background: rgba(255, 177, 74, 0.12);
}

.nav__item[aria-selected="true"]::before { transform: scaleX(1); }

.nav__icon { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; }

.nav__item[data-panel="players"],
.nav__item[data-panel="timeline"],
.nav__item[data-panel="breakdown"],
.nav__item[data-panel="deaths"],
.nav__item[data-panel="auras"],
.nav__item[data-panel="raw"] { display: none; }

.main {
  grid-column: 2;
  grid-row: 2;
  padding: var(--space-8) var(--space-10);
  overflow-y: auto;
  animation: fadeUp var(--transition-slow) ease-out var(--space-3) both;
  position: relative;
}

.main::before {
  content: '';
  position: fixed;
  inset: var(--header-h) 0 0 var(--sidebar-w);
  pointer-events: none;
  opacity: 0.44;
  background-image:
    linear-gradient(var(--gridline) 1px, transparent 1px),
    linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at 50% 20%, black, transparent 72%);
}

@keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.upload-zone {
  border: 1px solid rgba(255, 177, 74, 0.34);
  border-radius: 28px;
  padding: var(--space-16) var(--space-8);
  text-align: center;
  background:
    linear-gradient(135deg, rgba(125, 92, 255, 0.18), transparent 35%),
    repeating-linear-gradient(90deg, transparent 0 18px, rgba(98, 242, 194, 0.06) 18px 20px),
    linear-gradient(180deg, rgba(20, 31, 54, 0.94), rgba(8, 12, 26, 0.94));
  transition: all var(--transition-base);
  position: relative;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38), inset 0 0 0 1px rgba(255,255,255,0.04);
}

.upload-zone::before {
  content: '';
  position: absolute;
  inset: 18% -20%;
  background: linear-gradient(90deg, transparent, rgba(98, 242, 194, 0.0) 20%, rgba(98, 242, 194, 0.48) 21%, transparent 22%, transparent 42%, rgba(255, 177, 74, 0.48) 43%, transparent 44%, transparent);
  opacity: 0.5;
  transform: skewY(-8deg);
  animation: combatPulse 5.5s linear infinite;
}

@keyframes combatPulse { from { translate: -28% 0; } to { translate: 28% 0; } }

.upload-zone:hover,
.upload-zone.drag-active {
  border-color: var(--healer-mint);
  transform: translateY(-2px);
}

.upload-zone:hover::before,
.upload-zone.drag-active::before { opacity: 0.82; }

.upload-zone__icon {
  width: 80px;
  height: 80px;
  margin: 0 auto var(--space-6);
  stroke: var(--healer-mint);
  opacity: 0.82;
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } }

.upload-zone__title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.06em;
  margin-bottom: var(--space-2);
}

.upload-zone__desc {
  color: var(--ink-muted);
  font-size: var(--text-base);
  max-width: 400px;
  margin: 0 auto var(--space-6);
}

.upload-zone__hint {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--gold-glint);
  background: rgba(6, 9, 20, 0.68);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  display: inline-block;
  border: 1px solid var(--gridline);
}

.upload-zone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

.fight-list { display: flex; flex-direction: column; gap: var(--space-4); }

.fight-card {
  background: linear-gradient(90deg, rgba(20, 31, 54, 0.92), rgba(13, 20, 38, 0.72));
  border: 1px solid var(--gridline);
  border-radius: 18px;
  padding: var(--space-5) var(--space-6);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: var(--space-6);
  align-items: center;
  transition: all var(--transition-fast);
  cursor: pointer;
  animation: fadeUp var(--transition-base) ease-out both;
}

.fight-card:nth-child(1) { animation-delay: 50ms; }
.fight-card:nth-child(2) { animation-delay: 100ms; }
.fight-card:nth-child(3) { animation-delay: 150ms; }
.fight-card:nth-child(4) { animation-delay: 200ms; }
.fight-card:nth-child(5) { animation-delay: 250ms; }

.fight-card:hover {
  border-color: rgba(255, 177, 74, 0.54);
  background: linear-gradient(90deg, rgba(30, 42, 72, 0.98), rgba(13, 20, 38, 0.86));
  transform: translateX(4px);
}

.fight-card:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-vein); }

.fight-card__boss {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.04em;
  white-space: nowrap;
}

.fight-card__meta { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; }

.fight-card__meta-item { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--ink-muted); }

.fight-card__meta-item--duration { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }

.fight-card__meta-item--difficulty {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  font-size: var(--text-xs);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  background: rgba(125, 92, 255, 0.18);
  color: var(--healer-mint);
}

.fight-card__meta-item--kill { color: #4ade80; font-weight: 600; }

.fight-card__players {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.fight-card__team {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.fight-card__team-label {
  width: 52px;
  color: var(--ink-faint);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fight-card__team-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}

.fight-card__player {
  display: inline-flex;
  align-items: center;
  max-width: 160px;
  padding: 2px 7px;
  border-left: 3px solid currentColor;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.045);
  color: var(--player-color, var(--ink-muted));
  font-family: var(--font-mono);
  font-size: 0.68rem;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fight-card__player--more {
  border-left-color: var(--gridline);
  color: var(--ink-faint);
}

.fight-card__arrow {
  width: 24px;
  height: 24px;
  stroke: var(--ink-muted);
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.fight-card:hover .fight-card__arrow { stroke: var(--gold-vein); transform: translateX(4px); }

.fight-detail { animation: fadeUp var(--transition-slow) ease-out both; }

.fight-subnav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
  padding: var(--space-2);
  border: 1px solid var(--gridline);
  border-radius: 999px;
  background: rgba(6, 9, 20, 0.54);
}

.fight-subnav__item {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink-muted);
  padding: var(--space-2) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
}

.fight-subnav__item:hover,
.fight-subnav__item[aria-selected="true"] {
  background: rgba(255, 177, 74, 0.14);
  color: var(--ink);
}

.fight-subpanel {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.fight-detail__header {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4) var(--space-6);
  align-items: flex-end;
  margin-bottom: var(--space-8);
  padding-bottom: var(--space-6);
  border-bottom: 1px solid rgba(201, 168, 76, 0.15);
}

.fight-detail__boss {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  color: var(--gold-glint);
  line-height: 1.1;
}

.fight-detail__meta { display: flex; flex-wrap: wrap; gap: var(--space-4); }

.fight-detail__meta-item { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--ink-muted); }

strong { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.timeline {
  background: rgba(13, 20, 38, 0.84);
  border: 1px solid var(--gridline);
  border-radius: 24px;
  padding: var(--space-6);
  margin-bottom: var(--space-8);
  position: relative;
  overflow: hidden;
}

.timeline::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--healer-mint), var(--gold-vein), transparent);
}

.timeline__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4); }

.timeline__title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.05em;
}

.timeline__controls { display: flex; gap: var(--space-2); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--gridline);
  background: rgba(20, 31, 54, 0.82);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.btn:hover { border-color: var(--gold-vein); color: var(--gold-glint); background: rgba(255, 177, 74, 0.11); }

.btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-vein); }

.btn--primary { background: var(--gold-vein); border-color: var(--gold-vein); color: var(--ink-well); }

.btn--primary:hover { background: var(--gold-glint); border-color: var(--gold-glint); }

.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.timeline__boss-hp {
  height: 48px;
  background: var(--ink-well);
  border-radius: var(--radius-md);
  position: relative;
  margin-bottom: var(--space-6);
  overflow: hidden;
  border: 1px solid rgba(201, 168, 76, 0.1);
}

.timeline__hp-bar {
  height: 100%;
  background: linear-gradient(90deg, #c41e3a 0%, #e03e3e 50%, #c41e3a 100%);
  border-radius: var(--radius-md);
  transform-origin: left;
  transform: scaleX(0);
  animation: hpDraw 1.2s ease-out 0.3s forwards;
  position: relative;
}

@keyframes hpDraw { to { transform: scaleX(1); } }

.timeline__hp-phase {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--gold-vein);
  opacity: 0;
  animation: phasePop 0.3s ease-out forwards;
}

@keyframes phasePop { to { opacity: 1; transform: scaleY(1); } }

.timeline__phase-labels {
  display: flex;
  justify-content: space-between;
  padding: var(--space-3) var(--space-2) 0;
  font-size: var(--text-xs);
  color: var(--ink-faint);
  font-family: var(--font-mono);
}

.timeline__tracks { display: flex; flex-direction: column; gap: var(--space-3); }

.track {
  height: 44px;
  background: var(--ink-well);
  border-radius: var(--radius-sm);
  position: relative;
  border: 1px solid rgba(201, 168, 76, 0.08);
  overflow: hidden;
}

.track__label {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 140px;
  display: flex;
  align-items: center;
  padding-left: var(--space-3);
  background: linear-gradient(90deg, var(--parchment) 0%, transparent 100%);
  border-right: 1px solid rgba(201, 168, 76, 0.1);
  z-index: 2;
  pointer-events: none;
}

.track__class-color {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: var(--space-3);
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}

.track__name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track__spec {
  font-size: var(--text-xs);
  color: var(--ink-muted);
  margin-left: var(--space-2);
  white-space: nowrap;
}

.track__events {
  position: absolute;
  left: 140px; right: 0; top: 0; bottom: 0;
  display: flex;
  align-items: center;
  padding: 0 var(--space-2);
}

.event {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 8px;
  height: 8px;
  border-radius: 2px;
  cursor: pointer;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  z-index: 1;
  animation: eventPop 0.4s ease-out forwards;
}

@keyframes eventPop { to { transform: translateY(-50%) scale(1); } }

.event--damage { background: #ff6b6b; border-radius: 1px; }
.event--heal { background: #4ade80; border-radius: 50%; }
.event--cd { background: var(--gold-vein); border-radius: 1px; transform: translateY(-50%) rotate(45deg) scale(0); }
.event--mechanic { background: #fbbf24; border-radius: 50%; border: 2px solid var(--ink-well); }
.event--death { background: var(--ink-well); border: 2px solid #f87171; border-radius: 1px; width: 10px; height: 10px; }

.event:hover {
  transform: translateY(-50%) scale(2.5);
  box-shadow: 0 0 12px currentColor;
  z-index: 10;
}

.event--cd:hover { transform: translateY(-50%) rotate(45deg) scale(2.5); }

.event__tooltip {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: var(--ink-well);
  border: 1px solid var(--gold-vein);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-xs);
  line-height: 1.5;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
  z-index: 20;
  font-family: var(--font-mono);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.event:hover .event__tooltip { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.event__tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--gold-vein);
}

.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-4);
}

.player-card {
  background: var(--parchment);
  border: 1px solid rgba(201, 168, 76, 0.12);
  border-radius: var(--radius-md);
  padding: var(--space-5);

.aura-card {

.aura-item {

.aura-item:last-child {

.hidden { display: none !important; }

@media (max-width: 1024px) {

};

const DIFFICULTY_LABELS = { 14: 'Normal', 15: 'Heroic', 16: 'Mythic', 17: 'LFR' };
const STORED_LOG_KEY = 'combatLogParser.currentLog';
const LOG_DB_NAME = 'combatLogParserDB';
const LOG_STORE_NAME = 'logs';

function parseDateTime(dateTime) {
  const dateTimeSeparatorIndex = dateTime.indexOf(' ');
  const date = dateTime.substr(0, dateTimeSeparatorIndex);
  const time = dateTime.substr(dateTimeSeparatorIndex + 1);

  const dateParts = date.split('/');
  const month = parseInt(dateParts[0], 10);
  const day = parseInt(dateParts[1], 10);
  const year = parseInt(dateParts[2], 10);

  const timeMatch = time.match(/^(\d{2}):(\d{2}):(\d{2})\.(\d{3})([+-]\d{1,2}(?::?\d{2})?)?$/);
  if (!timeMatch) throw new Error(`Invalid time format: ${time}`);

  const hour = parseInt(timeMatch[1], 10);
  const minute = parseInt(timeMatch[2], 10);
  const second = parseInt(timeMatch[3], 10);
  const millisecond = parseInt(timeMatch[4], 10);
  const tzOffset = timeMatch[5];

  const dateObj = new Date(Date.UTC(year, month - 1, day, hour, minute, second, millisecond));

  if (tzOffset) {
    const sign = tzOffset[0] === '-' ? -1 : 1;
    const offsetParts = tzOffset.substring(1).split(':');
    const offsetHours = parseInt(offsetParts[0], 10);
    const offsetMinutes = offsetParts[1] ? parseInt(offsetParts[1], 10) : 0;
    const totalOffsetMinutes = sign * (offsetHours * 60 + offsetMinutes);
    dateObj.setMinutes(dateObj.getMinutes() - totalOffsetMinutes);
  }

  return dateObj;
}

function splitLine(line) {
  const partSeparator = ',';
  const nestingCharacters = { '"': '"', '[': ']', '(': ')' };
  const parts = [];
  const lineLength = line.length;
  let currentPartStartIndex = 0;
  let nestingType = null;

  for (let i = 0; i < lineLength; i += 1) {
    const character = line[i];

    if (i === currentPartStartIndex && nestingCharacters[character] !== undefined) {
      nestingType = character;
    }

    if (character === partSeparator) {
      if (nestingType !== null) {
        const previousCharacter = line[i - 1];
        if (previousCharacter !== nestingCharacters[nestingType]) continue;
        const isEscaped = line[i - 2] === '\\';
        if (isEscaped) continue;
      }

      let partStartIndex = currentPartStartIndex;
      let partEndIndex = i;
      if (nestingType === '"') {
        partStartIndex += 1;
        partEndIndex -= 1;
      }
      const partLength = partEndIndex - partStartIndex;
      let part = line.substr(partStartIndex, partLength);
      if (nestingType === '"' && part.indexOf('\\') !== -1) {
        part = part.replace(/\\"/g, '"');
      }
      parts.push(part);

      currentPartStartIndex = i + partSeparator.length;
      nestingType = null;
    }
  }
  parts.push(line.substr(currentPartStartIndex));
  return parts;
}

function parseCombatantInfo(parts) {
  let i = 0;
  const player = {
    playerId: parts[i++],
    strength: parseInt(parts[i++], 10),
    agility: parseInt(parts[i++], 10),
    stamina: parseInt(parts[i++], 10),
    intellect: parseInt(parts[i++], 10),

    gear: parts[i++],
    buffs: parts[i++]
  };
  player.specName = SPEC_NAMES[player.specId] || `Spec ${player.specId}`;
  return player;
}

function parseLogFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    persistCurrentLog(text);
    loadLogText(text);
  };
  reader.onerror = (err) => console.error('File read error:', err);
  reader.readAsText(file);
}

function loadLogText(text) {
  state = {
    fights: [],
    players: new Map(),
    events: [],
    currentFight: null,
    selectedSourceGuid: null,
    selectedSpellKey: null,
    selectedFightPanel: 'breakdown',
    petOwners: new Map(),
    rawLines: text.split('\n')
  };
  parseRawLines();
  renderFightList();
  renderPlayerGrid();
  renderTimeline();
  renderRawLog();
  renderBreakdownView();
  renderDeathsView();
  renderAurasView();
}

function persistCurrentLog(text) {
  openLogDatabase()
    .then(db => putStoredLog(db, text))
    .catch(err => console.warn('Could not persist combat log.', err));
}

function restorePersistedLog() {
  openLogDatabase()
    .then(db => getStoredLog(db))
    .then(text => {
      if (!text) return;
      uploadZone.classList.add('hidden');
      fightList.classList.remove('hidden');
      switchTab('fights');
      loadLogText(text);
    })
    .catch(err => console.warn('Could not restore persisted combat log.', err));
}

function openLogDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(LOG_DB_NAME, 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore(LOG_STORE_NAME);
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function putStoredLog(db, text) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(LOG_STORE_NAME, 'readwrite');
    tx.objectStore(LOG_STORE_NAME).put(text, STORED_LOG_KEY);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function getStoredLog(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(LOG_STORE_NAME, 'readonly');
    const request = tx.objectStore(LOG_STORE_NAME).get(STORED_LOG_KEY);
    request.onsuccess = () => resolve(request.result || '');
    request.onerror = () => reject(request.error);
  });
}

function parseRawLines() {
  const COMBAT_GAP_THRESHOLD = 12000;
  const MIN_FIGHT_DURATION = 5000;
  const MAX_FIGHT_DURATION = 30 * 60 * 1000;
  const fights = [];
  let currentFightStart = null;

  const encounterFights = [];
  const combatEvents = [];

  state.rawLines.forEach((line, lineNo) => {
    if (!line.trim()) return;
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) return;
    const rawDateTime = line.substr(0, timeEndIndex);
    const event = line.substr(timeEndIndex + 2);
    const eventNameEndIndex = event.indexOf(',');
    if (eventNameEndIndex === -1) return;
    const eventName = event.substr(0, eventNameEndIndex);
    const rawEventParams = event.substr(eventNameEndIndex + 1);

    if (eventName === 'ENCOUNTER_START') {
      const parts = splitLine(rawEventParams);
      currentFightStart = {
        lineNo,
        dateTime: parseDateTime(rawDateTime),
        event: parts
      };
    } else if (eventName === 'ENCOUNTER_END' && currentFightStart) {
      const parts = splitLine(rawEventParams);
      const bossId = Number(parts[0]);
      const bossName = parts[1];
      const difficulty = Number(parts[2]);
      const kill = parts[4] == '1';

      const isSameFight = currentFightStart.event[0] === parts[0] &&
                          currentFightStart.event[1] === parts[1] &&
                          currentFightStart.event[2] === parts[2];

      if (isSameFight) {
        const endDateTime = parseDateTime(rawDateTime);
        const duration = endDateTime - currentFightStart.dateTime;
        encounterFights.push({
          startLineNo: currentFightStart.lineNo,
          endLineNo: lineNo,
          startDateTime: currentFightStart.dateTime,
          endDateTime,
          bossId,
          bossName,
          difficulty,
          kill,
          duration
        });
      }
      currentFightStart = null;
    }

    if (isCombatBoundaryEvent(eventName)) {
      const parts = splitLine(rawEventParams);
      combatEvents.push({
        lineNo,
        dateTime: parseDateTime(rawDateTime),
        eventName,
        sourceId: parts[0] || '',
        destId: parts[4] || ''
      });
    }
  });

  if (encounterFights.length > 0) {
    fights.push(...encounterFights);
  }

  const timeGapFights = buildTimeGapFights(combatEvents, fights.length + 1, COMBAT_GAP_THRESHOLD, MIN_FIGHT_DURATION, MAX_FIGHT_DURATION);

  for (const gf of timeGapFights) {
    const overlapsEncounter = fights.some(f => gf.startLineNo <= f.endLineNo && gf.endLineNo >= f.startLineNo);
    if (!overlapsEncounter) fights.push(gf);
  }

  fights.sort((a, b) => a.startLineNo - b.startLineNo);
  state.fights = fights;
  parseAllEvents();
}

function isCombatBoundaryEvent(eventName) {
  if (eventName === 'COMBAT_LOG_VERSION' || eventName === 'COMBATANT_INFO') return false;
  if (eventName === 'SPELL_CAST_SUCCESS' || eventName === 'SPELL_AURA_APPLIED' || eventName === 'SPELL_AURA_REMOVED') return false;
  return eventName.includes('_DAMAGE') ||
    eventName.includes('_HEAL') ||
    eventName.includes('_MISSED') ||
    eventName === 'SWING_DAMAGE' ||
    eventName === 'SWING_MISSED' ||
    eventName === 'RANGE_DAMAGE' ||
    eventName === 'RANGE_MISSED' ||
    eventName === 'UNIT_DIED' ||
    eventName === 'PARTY_KILL';
}

function buildTimeGapFights(combatEvents, startIndex, gapThreshold, minDuration, maxDuration) {
  const fights = [];
  if (combatEvents.length < 2) return fights;

  let segStart = combatEvents[0];
  let previous = combatEvents[0];

  for (let i = 1; i < combatEvents.length; i++) {
    const current = combatEvents[i];
    const gap = current.dateTime - previous.dateTime;
    if (gap > gapThreshold) {
      addTimeGapFight(fights, segStart, previous, startIndex, minDuration, maxDuration);
      segStart = current;
    }
    previous = current;
  }

  addTimeGapFight(fights, segStart, previous, startIndex, minDuration, maxDuration);
  return fights;
}

function addTimeGapFight(fights, startEvent, endEvent, startIndex, minDuration, maxDuration) {
  const duration = endEvent.dateTime - startEvent.dateTime;
  if (duration < minDuration || duration > maxDuration) return;

  fights.push({
    startLineNo: startEvent.lineNo,
    endLineNo: endEvent.lineNo,
    startDateTime: startEvent.dateTime,
    endDateTime: endEvent.dateTime,
    bossId: 0,
    bossName: `Fight ${startIndex + fights.length}`,
    difficulty: 0,
    kill: false,
    duration
  });
}

function parseAllEvents() {
  const players = new Map();
  const events = [];
  const playerGUIDs = new Set();
  const petOwners = new Map();

  state.rawLines.forEach((line, lineNo) => {
    if (!line.trim()) return;
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) return;
    const rawDateTime = line.substr(0, timeEndIndex);
    const event = line.substr(timeEndIndex + 2);
    const eventNameEndIndex = event.indexOf(',');
    if (eventNameEndIndex === -1) return;
    const eventName = event.substr(0, eventNameEndIndex);
    const rawEventParams = event.substr(eventNameEndIndex + 1);

    if (eventName === 'COMBATANT_INFO') {
      const parts = splitLine(rawEventParams);
      try {
        const player = parseCombatantInfo(parts);
        players.set(player.playerId, player);
      } catch (e) {
        console.error('COMBATANT_INFO parse error at line', lineNo, e);
      }
    }

    // Collect GUIDs from all events where source/dest fields exist and start with 'Player-'
    const parts = splitLine(rawEventParams);
    if (parts.length >= 5) {
      const sourceId = parts[0];
      const destId = parts[4];
      if (sourceId && sourceId.startsWith('Player-')) playerGUIDs.add(sourceId);
      if (destId && destId.startsWith('Player-')) playerGUIDs.add(destId);
      if (eventName === 'SPELL_SUMMON' && sourceId && sourceId.startsWith('Player-') && destId && !destId.startsWith('Player-')) {
        petOwners.set(destId, sourceId);
      }
    }

    events.push({
      lineNo,
      rawDateTime,
      type: eventName,
      params: rawEventParams
    });
  });

  for (const guid of playerGUIDs) {
    if (!players.has(guid)) {
      players.set(guid, {
        playerId: guid,
        specId: 0,
        specName: getDisplayName('', guid),
        strength: 0, agility: 0, stamina: 0, intellect: 0,
        dodge: 0, parry: 0, block: 0,
        critMelee: 0, critRanged: 0, critSpell: 0,
        speed: 0, leech: 0,
        hasteMelee: 0, hasteRanged: 0, hasteSpell: 0,
        avoidance: 0, mastery: 0,
        versatilityDamageDone: 0, versatilityHealingDone: 0, versatilityDamageReduction: 0,
        armor: 0
      });
    }
  }

  state.players = players;
  state.events = events;
  state.petOwners = petOwners;
}

function getFightPlayerRows(fight) {
  return buildDamageDoneRows(fight)
    .filter(row => row.guid && row.guid.startsWith('Player-'))
    .sort((a, b) => b.amount - a.amount);
}

function renderFightPlayerChips(players) {
  const friendly = players.filter(player => player.faction === 'friendly');
  const hostile = players.filter(player => player.faction === 'hostile');
  const unknown = players.filter(player => player.faction !== 'friendly' && player.faction !== 'hostile');
  return `${renderFightTeamRow('Friendly', friendly.concat(unknown))}${renderFightTeamRow('Hostile', hostile)}`;
}

function renderFightTeamRow(label, players) {
  const visiblePlayers = players.slice(0, 10);
  const hiddenCount = Math.max(0, players.length - visiblePlayers.length);
  const chips = visiblePlayers.map(player => {
    const color = getPlayerClassColor(player.guid);
    return `<span class="fight-card__player" style="--player-color: ${color};" title="${escapeHtml(player.name)}">${escapeHtml(player.name)}</span>`;
  });
  if (hiddenCount > 0) chips.push(`<span class="fight-card__player fight-card__player--more">+${hiddenCount}</span>`);
  if (chips.length === 0) chips.push(`<span class="fight-card__player fight-card__player--more">none</span>`);
  return `<div class="fight-card__team"><span class="fight-card__team-label">${label}</span><span class="fight-card__team-list">${chips.join('')}</span></div>`;
}

function getPlayerClassColor(guid) {
  const classKey = getPlayerClassKey(guid);

}

    253: 'hunter', 254: 'hunter', 255: 'hunter',
    62: 'mage', 63: 'mage', 64: 'mage',
    268: 'monk', 269: 'monk', 270: 'monk',
    65: 'paladin', 66: 'paladin', 70: 'paladin',
    256: 'priest', 257: 'priest', 258: 'priest',
    259: 'rogue', 260: 'rogue', 261: 'rogue',
    262: 'shaman', 263: 'shaman', 264: 'shaman',

function renderFightSubnav() {

function attachFightSubnavHandlers() {

function renderFightSubpanelContent() {

function renderFightTimelineContent(fight) {
  const events = state.events

    .slice(0, 120);

    <div class="breakdown-list">
      ${events.map(event => {

function renderFightRawContent(fight) {
  const lines = state.rawLines.slice(fight.startLineNo, fight.endLineNo + 1).slice(0, 1000);
  return `<div class="raw-log"><div class="raw-log__header"><span>Raw lines for this fight</span><span>${lines.length.toLocaleString()} shown</span></div><div class="raw-log__content">

function renderTimeline() {
  timelineTracksEl.innerHTML = '';
  bossHpEl.innerHTML = '';
  phaseLabelsEl.innerHTML = '';

  if (state.fights.length === 0) return;

  const fight = state.currentFight || state.fights[0];
  if (!fight) return;

  // Boss HP Bar
  const bossHpRatio = 100; // Assuming full health for simplification here
  bossHpEl.innerHTML = `<div class="timeline__hp-bar" style="width: ${bossHpRatio}%"></div>`;

  // Phases
  const phases = ['Phase 1', 'Phase 2', 'Phase 3']; // Example phases
  phases.forEach((phase, index) => {
    phaseLabelsEl.innerHTML += `<span class="timeline__phase-labels__label">${phase}</span>`;
    bossHpEl.innerHTML += `<div class="timeline__hp-phase" style="left: ${Math.floor(index / (phases.length - 1) * 100)}%; animation-delay: ${index * 0.3}s;"></div>`;
  });

  const fightEvents = state.events
    .filter(e => e.lineNo >= fight.startLineNo && e.lineNo <= fight.endLineNo && isCombatBoundaryEvent(e.type))
    .slice(0, 250);

  const fragment = document.createDocumentFragment();
  fightEvents.forEach(event => {
    const { lineNo, rawDateTime, type, params } = event;
    const dt = parseDateTime(rawDateTime);
    
    // Simplified timeline positioning based on time relative to fight start
    const fightStart = fight.startDateTime;
    const totalDurationMs = fight.duration;
    const timeOffsetMs = dt - fightStart;
    const positionPercent = totalDurationMs > 0 ? Math.max(0, Math.min(100, (timeOffsetMs / totalDurationMs) * 100)) : 0;

    const trackDiv = document.createElement('div');
    trackDiv.className = 'track';
    
    let trackName = type;
    let trackSpec = '';
    let classColor = 'var(--ink-muted)';
    
    if (type.includes('DAMAGE')) { classColor = CLASS_COLORS['warrior']; trackName = 'Damage'; }
    if (type.includes('HEAL')) { classColor = CLASS_COLORS['priest']; trackName = 'Heal'; }
    if (type.includes('SPELL')) { classColor = '#fbbf24'; trackName = 'Spell'; }

    trackDiv.innerHTML = `
      <div class="track__label">${trackName}</div>
      <div class="track__events" style="left: ${positionPercent}%;">
        <div class="event event--${type.toLowerCase().includes('damage') ? 'damage' : type.toLowerCase().includes('heal') ? 'heal' : 'mechanic'}" 
             style="left: 0%; top: 50%; transform: translateY(-50%) scale(1); z-index: 5;" 
             title="${rawDateTime}">
        </div>
      </div>
    `;
    fragment.appendChild(trackDiv);
  });
  timelineTracksEl.appendChild(fragment);
}

function renderRawLog() {
  if (state.rawLines.length === 0) {
    rawLogContent.innerHTML = '<p class="empty-state__desc">No log lines found.</p>';
    document.getElementById('raw-line-count').textContent = '0 lines';
    return;
  }

  const fight = state.currentFight;
  const fightLines = fight ? state.rawLines.slice(fight.startLineNo, fight.endLineNo + 1) : [];
  const visibleLines = fight
    ? fightLines.slice(0, 3000)
    : state.rawLines.slice(0, 1000);
  const hiddenCount = fight ? Math.max(0, fightLines.length - visibleLines.length) : Math.max(0, state.rawLines.length - visibleLines.length);
  let html = '';
  visibleLines.forEach((line, index) => {
    const lineNo = fight ? fight.startLineNo + index : index;
    if (!line.trim()) return;
    const timeEndIndex = line.indexOf('  ');
    if (timeEndIndex === -1) return;
    const rawDateTime = line.substr(0, timeEndIndex);
    const event = line.substr(timeEndIndex + 2);
    const eventNameEndIndex = event.indexOf(',');
    if (eventNameEndIndex === -1) return;
    const eventName = event.substr(0, eventNameEndIndex);
    const rawEventParams = event.substr(eventNameEndIndex + 1);

    let lineClass = '';
    if (eventName === 'ENCOUNTER_START' || eventName === 'ENCOUNTER_END') lineClass = 'raw-log__event';
    if (eventName === 'COMBATANT_INFO') lineClass = 'raw-log__event';

    html += `<div class="raw-log__line ${lineClass}">
      <span class="raw-log__timestamp">${rawDateTime}</span>
      <span class="raw-log__event">${eventName}:</span>
      <span class="raw-log__params">${rawEventParams}</span>
    </div>`;
  });

  if (hiddenCount > 0) {
    html += `<div class="raw-log__line raw-log__line--highlight">Showing ${visibleLines.length.toLocaleString()} lines. ${hiddenCount.toLocaleString()} more hidden to keep the page responsive.</div>`;
  }

  rawLogContent.innerHTML = html;
  document.getElementById('raw-line-count').textContent = `${state.rawLines.length} lines`;
}

function renderBreakdownView() {
  const viewEl = document.getElementById('breakdown-view');
  if (state.fights.length === 0) {
    viewEl.innerHTML = `<div class="empty-state">
      <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <h3 class="empty-state__title">No Fight Data</h3>
      <p class="empty-state__desc">Load a combat log to generate a breakdown.</p>
    </div >`;
    return;
  }

  const fight = state.currentFight || state.fights[0];
  if (!fight) return;

  viewEl.innerHTML = renderBreakdownContent(fight);
  attachBreakdownHandlers(viewEl);
}

function renderBreakdownContent(fight) {
  const sourceRows = buildDamageDoneRows(fight);
  const totalDamage = sourceRows.reduce((sum, row) => sum + row.amount, 0);
  const selectedRow = state.selectedSourceGuid ? sourceRows.find(row => row.guid === state.selectedSourceGuid) : null;
  const selectedSpell = selectedRow && state.selectedSpellKey ? selectedRow.spells.find(spell => spell.key === state.selectedSpellKey) : null;

  return `
    <div class="breakdown-controls">
      <button class="filter-btn filter-btn--active">Damage Done</button>
      <span class="breakdown-row__sub">${escapeHtml(fight.bossName)} · ${formatDuration(fight.duration)} · ${formatNumber(totalDamage)} total</span>
    </div>
    ${selectedSpell && selectedRow ? renderSpellDamageDrilldown(selectedRow, selectedSpell, fight) : renderDamageDoneTable(sourceRows, totalDamage, fight)}
  `;
}

function attachBreakdownHandlers(rootEl) {
  rootEl.querySelectorAll('[data-source-guid]').forEach(row => {
    const selectSource = () => {
      state.selectedSourceGuid = row.dataset.sourceGuid;
      state.selectedSpellKey = null;
      rerenderBreakdowns();
    };
    row.addEventListener('click', selectSource);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSource(); } });
  });

  rootEl.querySelectorAll('[data-spell-key]').forEach(row => {
    const selectSpell = (event) => {
      event.stopPropagation();
      state.selectedSpellKey = row.dataset.spellKey;
      rerenderBreakdowns();
    };
    row.addEventListener('click', selectSpell);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSpell(e); } });
  });

  const backButton = rootEl.querySelector('[data-breakdown-back]');
  if (backButton) {
    backButton.addEventListener('click', () => {
      state.selectedSourceGuid = null;
      state.selectedSpellKey = null;
      rerenderBreakdowns();
    });
  }

  const spellBackButton = rootEl.querySelector('[data-spell-back]');
  if (spellBackButton) {
    spellBackButton.addEventListener('click', () => {
      state.selectedSpellKey = null;
      rerenderBreakdowns();
    });
  }
}

function rerenderBreakdowns() {
  if (state.currentFight) renderFightDetail();
  const breakdownPanelVisible = panels.breakdown && !panels.breakdown.classList.contains('hidden');
  if (breakdownPanelVisible) renderBreakdownView();
}

function renderDamageDoneTable(rows, totalDamage, fight) {
  if (rows.length === 0) {
    return `<div class="empty-state"><h3 class="empty-state__title">No Damage Events</h3><p class="empty-state__desc">No damage events were found inside this fight window.</p></div>`;
  }

  const fightSeconds = Math.max(1, fight.duration / 1000);
  const hierarchy = buildDamageHierarchy(rows);
  const maxAmount = Math.max(...rows.map(row => row.amount), 1);
  return `<div class="breakdown-list">
    ${hierarchy.map((group, index) => `${renderDamageRow(group.player, index + 1, totalDamage, fightSeconds, maxAmount, false)}${group.minions.map(minion => renderDamageRow(minion, '', totalDamage, fightSeconds, maxAmount, true)).join('')}`).join('')}
  </div>`;
}

function buildDamageHierarchy(rows) {
  const players = rows.filter(row => row.guid.startsWith('Player-'));
  const minionsByOwner = new Map();
  const orphanMinions = [];

  rows.filter(row => !row.guid.startsWith('Player-')).forEach(row => {
    if (row.ownerGuid) {
      if (!minionsByOwner.has(row.ownerGuid)) minionsByOwner.set(row.ownerGuid, []);
      minionsByOwner.get(row.ownerGuid).push(row);
    } else {
      orphanMinions.push(row);
    }
  });

  const groups = players.map(player => ({
    player,
    total: player.amount + (minionsByOwner.get(player.guid) || []).reduce((sum, minion) => sum + minion.amount, 0),
    minions: (minionsByOwner.get(player.guid) || []).sort((a, b) => b.amount - a.amount)
  }));

  orphanMinions.forEach(minion => groups.push({ player: minion, total: minion.amount, minions: [] }));
  return groups.sort((a, b) => b.total - a.total);
}

function renderDamageRow(row, rank, totalDamage, fightSeconds, maxAmount, isMinion) {
  const pctOfMax = Math.max(2, (row.amount / maxAmount) * 100);
  const pctOfTotal = totalDamage > 0 ? (row.amount / totalDamage) * 100 : 0;
  const isSelected = state.selectedSourceGuid === row.guid;
  return `<div class="breakdown-row ${isMinion ? 'breakdown-row--minion' : ''}" data-source-guid="${escapeHtml(row.guid)}" role="button" tabindex="0">
    <div class="breakdown-row__header">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background: var(--gold-vein);"></div>
      <div class="breakdown-row__info">
        <span class="breakdown-row__sub">${rank || 'pet'}</span>
        <strong>${escapeHtml(row.name)}</strong>
      </div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(row.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(row.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>
      </div>
    </div>
    ${isSelected ? renderInlineSpellRows(row) : ''}
  </div>`;
}

function renderInlineSpellRows(row) {
  const maxSpellAmount = row.spells[0]?.amount || 1;
  return `<div class="breakdown-row__spells">
    ${row.spells.map(spell => {
      const pctOfMax = Math.max(2, (spell.amount / maxSpellAmount) * 100);
      const pctOfSource = row.amount > 0 ? (spell.amount / row.amount) * 100 : 0;
      return `<div class="spell-row" data-spell-key="${escapeHtml(spell.key)}" role="button" tabindex="0">
        <span><strong>${escapeHtml(spell.name)}</strong><span class="breakdown-row__sub"> · ${escapeHtml(formatSpellActivity(spell))}</span></span>
        <span class="spell-bar-container"><div class="spell-bar-fill" style="width: ${pctOfMax}%;"></div></span>
        <span style="display:grid;grid-template-columns:82px 54px;gap:8px;font-family:var(--font-mono);text-align:right;"><span>${formatNumber(spell.amount)}</span><span class="breakdown-row__sub">${pctOfSource.toFixed(1)}%</span></span>
      </div>`;
    }).join('')}
  </div>`;
}

function renderSourceDamageDrilldown(row, totalDamage, fight) {
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const maxSpellAmount = row.spells[0]?.amount || 1;
  return `<div class="breakdown-list">
    <button class="btn" data-breakdown-back type="button">Back to Damage Done</button>
    <div class="breakdown-row">
      <div class="breakdown-row__header">
        <div class="breakdown-row__info">
          <strong>${escapeHtml(row.name)}</strong>
          <span class="breakdown-row__sub">${formatNumber(row.amount)} · ${formatNumber(Math.round(row.amount / fightSeconds))}/s · ${(totalDamage > 0 ? (row.amount / totalDamage) * 100 : 0).toFixed(1)}%</span>
        </div>
      </div>
      <div class="breakdown-row__spells">
        ${row.spells.map(spell => {
          const pctOfMax = Math.max(2, (spell.amount / maxSpellAmount) * 100);
          const pctOfSource = row.amount > 0 ? (spell.amount / row.amount) * 100 : 0;
          return `<div class="spell-row" data-spell-key="${escapeHtml(spell.key)}" role="button" tabindex="0">
            <span><strong>${escapeHtml(spell.name)}</strong><span class="breakdown-row__sub"> · ${escapeHtml(formatSpellActivity(spell))}</span></span>
            <span class="spell-bar-container"><div class="spell-bar-fill" style="width: ${pctOfMax}%;"></div></span>
            <span style="display:grid;grid-template-columns:82px 54px;gap:8px;font-family:var(--font-mono);text-align:right;"><span>${formatNumber(spell.amount)}</span><span class="breakdown-row__sub">${pctOfSource.toFixed(1)}%</span></span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function renderSpellDamageDrilldown(row, spell, fight) {
  const average = spell.hits > 0 ? Math.round(spell.amount / spell.hits) : 0;
  const critRate = spell.hits > 0 ? (spell.crits / spell.hits) * 100 : 0;
  const missRate = (spell.hits + spell.misses) > 0 ? (spell.misses / (spell.hits + spell.misses)) * 100 : 0;
  return `<div class="breakdown-list">
    <button class="btn" data-spell-back type="button">Back to ${escapeHtml(row.name)}</button>
    <div class="breakdown-row">
      <div class="breakdown-row__header">
        <div class="breakdown-row__info">
          <strong>${escapeHtml(spell.name)}</strong>
          <span class="breakdown-row__sub">${escapeHtml(row.name)} · ${formatNumber(spell.amount)} damage</span>
        </div>
        <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: 100%;"></div></div>
        <div class="breakdown-row__metrics">
          <span class="breakdown-row__val">${formatNumber(spell.amount)}</span>
          <span class="breakdown-row__sub">${escapeHtml(formatSpellActivity(spell))}</span>
        </div>
      </div>
      <div class="breakdown-row__spells">
        <div class="metric-grid">
          ${renderMetricCard(spell.applications > 0 ? 'applications' : 'casts', spell.applications > 0 ? spell.applications : spell.casts)}
          ${renderMetricCard('events', spell.events)}
          ${renderMetricCard('hits', spell.hits)}
          ${renderMetricCard('normal', spell.normals)}
          ${renderMetricCard('crits', spell.crits)}
          ${renderMetricCard('crit rate', `${critRate.toFixed(1)}%`)}
          ${renderMetricCard('misses', spell.misses)}
          ${renderMetricCard('miss rate', `${missRate.toFixed(1)}%`)}
          ${renderMetricCard('min', formatNumber(spell.min || 0))}
          ${renderMetricCard('max', formatNumber(spell.max || 0))}
          ${renderMetricCard('average', formatNumber(average))}
        </div>
      </div>
    </div>
  </div>`;
}

function renderMetricCard(label, value) {
  return `<div class="metric-card"><span class="metric-card__label">${escapeHtml(label)}</span><span class="metric-card__value">${escapeHtml(String(value))}</span></div>`;
}

function formatSpellActivity(spell) {
  const parts = [];
  if (spell.applications > 0) parts.push(`${spell.applications} applications`);
  else if (spell.casts > 0) parts.push(`${spell.casts} casts`);
  if (spell.hits > 0) parts.push(`${spell.hits} hits`);
  if (spell.misses > 0) parts.push(`${spell.misses} misses`);
  if (parts.length === 0) parts.push(`${spell.events} events`);
  return parts.join(' · ');
}

function buildDamageDoneRows(fight) {
  const sources = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    const damage = parseDamageEvent(event.type, event.params);
    if (!damage || !damage.sourceGuid) continue;

    if (!sources.has(damage.sourceGuid)) {
      sources.set(damage.sourceGuid, {
        guid: damage.sourceGuid,
        name: getDisplayName(damage.sourceName, damage.sourceGuid),
        faction: getReactionGroup(damage.sourceFlags),
        ownerGuid: state.petOwners.get(damage.sourceGuid) || null,
        amount: 0,
        spells: new Map()
      });
    }

    const source = sources.get(damage.sourceGuid);
    source.amount += damage.amount;
    const spellKey = `${damage.spellId || 0}:${damage.spellName}`;
    const currentSpell = source.spells.get(spellKey) || {
      key: spellKey,
      name: damage.spellName,
      amount: 0,
      events: 0,
      casts: 0,
      applications: 0,
      hits: 0,
      normals: 0,
      crits: 0,
      misses: 0,
      min: 0,
      max: 0
    };

    currentSpell.amount += damage.amount;
    currentSpell.events += 1;
    if (damage.isCast) currentSpell.casts += 1;
    if (damage.isAura) currentSpell.applications += 1;
    if (damage.isMiss) currentSpell.misses += 1;
    if (damage.amount > 0) {
      currentSpell.hits += 1;
      if (damage.isCrit) currentSpell.crits += 1;
      else currentSpell.normals += 1;
      currentSpell.min = currentSpell.min === 0 ? damage.amount : Math.min(currentSpell.min, damage.amount);
      currentSpell.max = Math.max(currentSpell.max, damage.amount);
    }
    source.spells.set(spellKey, currentSpell);
  }

  return Array.from(sources.values())
    .filter(source => source.amount > 0)
    .map(source => ({
      ...source,
      spells: Array.from(source.spells.values()).sort((a, b) => b.amount - a.amount)
    }))
    .sort((a, b) => b.amount - a.amount);
}

function parseDamageEvent(type, rawEventParams) {
  const isDamage = type.includes('_DAMAGE') || type === 'SWING_DAMAGE' || type === 'RANGE_DAMAGE';
  const isMiss = type.includes('_MISSED') || type === 'SWING_MISSED' || type === 'RANGE_MISSED';
  const isCast = type === 'SPELL_CAST_SUCCESS' || type === 'RANGE_CAST_SUCCESS';
  const isAura = type.includes('AURA_');
  if (!isDamage && !isMiss && !isCast && !isAura) return null;

  const parts = splitLine(rawEventParams);
  if (parts.length < 8) return null;

  const result = {
    sourceGuid: parts[0] || '',
    sourceName: parts[1] || '',
    sourceFlags: parseInt(parts[2], 10) || 0,
    spellId: 0,
    spellName: type === 'SWING_DAMAGE' ? 'Melee' : type,
    amount: 0,
    isCrit: false,
    isMiss,
    isCast,
    isAura
  };

  if (type === 'SWING_DAMAGE' || type === 'SWING_MISSED') {
    result.spellName = 'Melee';
    result.amount = readPositiveNumber(parts[14]) || readFirstLikelyAmount(parts, 8);
    result.isCrit = readHitFlags(parts[18]).crit;
    return result;
  }

  if (type === 'ENVIRONMENTAL_DAMAGE') {
    result.spellName = parts[8] || 'Environmental';
    result.amount = readPositiveNumber(parts[28]) || readFirstLikelyAmount(parts, 9);
    result.isCrit = readHitFlags(parts[31]).crit;
    return result;
  }

  result.spellId = parseInt(parts[8], 10) || 0;
  result.spellName = parts[9] || type;
  if (isDamage) {
    result.amount = readPositiveNumber(parts[15]) || readFirstLikelyAmount(parts, 11);
    result.isCrit = readHitFlags(parts[21]).crit || parts[21] === '1';
  }
  return result;
}

function readHitFlags(value) {
  const flags = parseInt(value, 10) || 0;
  return { crit: (flags & 1) === 1 };
}

function readPositiveNumber(value) {
  const num = Number(value);
  return Number.isFinite(num) && num > 0 ? num : 0;
}

function readFirstLikelyAmount(parts, startIndex) {
  for (let i = startIndex; i < parts.length; i++) {
    const num = readPositiveNumber(parts[i]);
    if (num >= 100) return num;
  }
  return 0;
}

function getDisplayName(name, guid) {
  const cleaned = typeof name === 'string' ? name.trim() : '';
  if (cleaned && cleaned.toLowerCase() !== 'nil' && cleaned !== '0x0000000000000000') return cleaned;
  if (guid && guid.startsWith('Player-')) return guid;
  return guid ? guid.split('-').pop() : 'Unknown';
}

// ============================================
// UTILITIES
// ============================================

function escapeHtml(unsafe) {
  if (typeof unsafe !== 'string') return unsafe;
  return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDuration(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}m ${seconds}s`;
}

function formatNumber(num) {
  if (!Number.isFinite(num)) return '0';
  if (num >= 1000000000) return `${(num / 1000000000).toFixed(2)}B`;
  if (num >= 1000000) return `${(num / 1000000).toFixed(2)}M`;
  if (num >= 1000) return `${(num / 1000).toFixed(1)}K`;
  return Math.round(num).toLocaleString();
}

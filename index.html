}

function renderDamageTakenContent(fight) {
  const targetRows = filterActorRows(buildDamageTakenRows(fight));
  const totalDamage = targetRows.reduce((sum, row) => sum + row.amount, 0);
  const selectedTarget = state.selectedDamageTakenGuid
    ? targetRows.find(row => row.guid === state.selectedDamageTakenGuid) || buildActorHierarchy(targetRows).find(group => group.player.guid === state.selectedDamageTakenGuid)?.player
    : null;
  const sourceRows = selectedTarget ? filterActorRows(buildDamageTakenSourceRows(fight, selectedTarget.guid)) : [];

  return `<div class="breakdown-controls">
      <button class="filter-btn filter-btn--active">Damage Taken</button>
      <span class="breakdown-row__sub">${escapeHtml(fight.bossName)} · ${formatDuration(fight.duration)} · ${formatNumber(totalDamage)} total</span>
    </div>
    ${selectedTarget ? renderDamageTakenSourceTable(selectedTarget, sourceRows, fight) : renderDamageTakenTargetTable(targetRows, totalDamage, fight, 'damage-taken')}`;
}

function renderDamageTakenTargetTable(rows, totalDamage, fight, reportKey = 'damage-taken') {
  if (rows.length === 0) {
    return `<div class="empty-state"><h3 class="empty-state__title">No Player Damage Taken</h3><p class="empty-state__desc">No player targets took damage in this fight window.</p></div>`;
  }
  const hierarchy = buildActorHierarchy(rows);
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const maxAmount = Math.max(...hierarchy.flatMap(group => [group.player, ...group.children]).map(row => row.amount), 1);
  return `<div class="breakdown-list">
    ${renderGroupedActorSections(hierarchy, (group, index) => `${renderDamageTakenTargetRow(group.player, index, totalDamage, fightSeconds, maxAmount, true, reportKey)}${isActorGroupExpanded(group.player.guid, reportKey) ? group.children.map(child => renderDamageTakenTargetRow(child, '', totalDamage, fightSeconds, maxAmount, false, reportKey)).join('') : ''}`)}
  </div>`;
}

function renderDamageTakenTargetRow(row, rank, totalDamage, fightSeconds, maxAmount, isTotal, reportKey = 'damage-taken') {
  const pctOfMax = Math.max(2, (row.amount / maxAmount) * 100);
  const pctOfTotal = totalDamage > 0 ? (row.amount / totalDamage) * 100 : 0;
  const expanded = isActorGroupExpanded(row.guid, reportKey);
  const actorColor = getActorClassColor(row.guid, row.ownerGuid);
  return `<div class="breakdown-row ${isTotal ? 'breakdown-row--total' : 'breakdown-row--minion'} ${getActorGroupClass(row)}" ${isTotal ? `data-actor-group-guid="${escapeHtml(row.guid)}" data-report-key="${escapeHtml(reportKey)}" aria-expanded="${expanded}"` : `data-taken-target-guid="${escapeHtml(row.guid)}"`} role="button" tabindex="0">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info"><span class="breakdown-row__sub">${rank ? `${expanded ? '−' : '+'} ${rank}` : (row.isPlayerActual ? 'player' : 'pet')}</span>${renderActorName(row.name, row.guid, '', row.ownerGuid)}${isTotal ? '<span class="breakdown-row__sub">total</span>' : ''}</div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(row.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(row.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>
      </div>
    </div>
  </div>`;
}

function renderDamageTakenSourceTable(target, rows, fight) {
  const totalDamage = rows.reduce((sum, row) => sum + row.amount, 0);
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const maxAmount = Math.max(...rows.map(row => row.amount), 1);
  return `<div class="breakdown-list">
    <button class="btn" data-damage-taken-back type="button">Back to Damage Taken</button>
    <div class="breakdown-row">
      <div class="breakdown-row__header">
        <div class="breakdown-row__info">${renderActorName(target.name, target.guid)}<span class="breakdown-row__sub">damage taken by source</span></div>
        <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: 100%;"></div></div>
        <div class="breakdown-row__metrics"><span class="breakdown-row__val">${formatNumber(totalDamage)}</span></div>
      </div>
    </div>
    ${rows.length > 0 ? renderGroupedFlatSections(rows, (row, index) => renderDamageTakenSourceRow(row, index, totalDamage, fightSeconds, maxAmount)) : renderCompactEmptyRow('damage sources')}

}

function renderDamageTakenSourceRow(row, rank, totalDamage, fightSeconds, maxAmount) {
  const pctOfMax = Math.max(2, (row.amount / maxAmount) * 100);
  const pctOfTotal = totalDamage > 0 ? (row.amount / totalDamage) * 100 : 0;
  const isSelected = state.selectedDamageTakenSourceGuid === row.guid;
  const actorColor = getActorClassColor(row.guid, row.ownerGuid);
  return `<div class="breakdown-row ${getActorGroupClass(row)}" data-taken-source-guid="${escapeHtml(row.guid)}" role="button" tabindex="0">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info"><span class="breakdown-row__sub">${rank}</span>${renderActorName(row.name, row.guid, '', row.ownerGuid)}</div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(row.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(row.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>

function renderEventCountReport(title, fight, typeTokens) {
  const rows = filterActorRows(buildEventCountRows(fight, typeTokens));
  return `<div class="breakdown-controls">
      <button class="filter-btn filter-btn--active">${escapeHtml(title)}</button>
      <span class="breakdown-row__sub">${escapeHtml(fight.bossName)} · ${formatDuration(fight.duration)}</span>
    </div>
    ${renderReportPanel(title, rows, fight, false, title === 'Casts' || title === 'Interrupts' || title === 'Dispels' ? 'casts' : 'events')}`;
}

function renderAuraReport(title, fight, auraType) {
  return `<div class="breakdown-controls">
      <button class="filter-btn filter-btn--active">${escapeHtml(title)}</button>
      <span class="breakdown-row__sub">${escapeHtml(fight.bossName)} · ${formatDuration(fight.duration)}</span>
    </div>
    ${renderReportPanel(title, filterActorRows(buildAuraRows(fight, auraType)), fight, false, 'applications')}`;
}

function renderReportPanel(title, rows, fight, interactive = false, unit = 'total') {
  const total = rows.reduce((sum, row) => sum + row.amount, 0);
  const topRows = rows.slice(0, 18);
  const reportKey = getReportKey(title);
  const expanded = hasExpandedActorGroup(topRows, reportKey);
  return `<section class="report-panel ${expanded ? 'report-panel--expanded' : ''}">
    <div class="report-panel__header">
      <span class="report-panel__title">${escapeHtml(title)}</span>
      <span class="report-panel__meta">${formatNumber(total)} ${escapeHtml(unit)}</span>
    </div>
    ${topRows.length > 0 ? (interactive ? renderDamageDoneTable(topRows, total, fight, reportKey) : renderHierarchicalReportTable(topRows, total, fight, reportKey)) : renderCompactEmptyRow(title)}
  </section>`;
}

function getReportKey(title) {
  return String(title).toLowerCase().replace(/[^a-z0-9]+/g, '-');
}

function filterActorRows(rows) {
  if (state.actorFilter !== 'players') return rows;
  return rows.filter(row => isPlayerOrPlayerOwned(row.guid, row.ownerGuid));
}

function isPlayerOrPlayerOwned(guid, ownerGuid = null) {
  return isPlayerGuid(guid) || isPlayerGuid(ownerGuid) || isPlayerGuid(state.petOwners.get(guid));
}

// When actorFilter == 'players', skip events that involve an NPC on either side.
// This ensures NPC-only damage amounts, spells, and targets are fully omitted
// from player rows — not just hidden from display.
function filterEventByActor(sourceGuid, destGuid) {
  if (state.actorFilter !== 'players') return true;
  return (isPlayerOrPlayerOwned(sourceGuid) || !sourceGuid || sourceGuid === '0000000000000000')
      && (isPlayerOrPlayerOwned(destGuid) || !destGuid || destGuid === '0000000000000000');
}

function hasExpandedActorGroup(rows, reportKey) {
  return buildActorHierarchy(rows).some(group => isActorGroupExpanded(group.player.guid, reportKey));
}

function renderHierarchicalReportTable(rows, total, fight, reportKey) {
  const hierarchy = buildActorHierarchy(rows);
  if (hierarchy.length === 0) return renderCompactEmptyRow('player rows');
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const maxAmount = Math.max(...hierarchy.map(group => group.total), 1);
  return `<div class="breakdown-list">
    ${renderGroupedActorSections(hierarchy, (group, index) => `${renderActorTotalRow(group.player, group.total, index, total, fightSeconds, maxAmount, reportKey)}${isActorGroupExpanded(group.player.guid, reportKey) ? group.children.map(child => renderActorChildRow(child, total, fightSeconds, maxAmount)).join('') : ''}`)}
  </div>`;
}

function renderGroupedActorSections(hierarchy, renderGroup) {
  let rank = 0;
  return hierarchy.map(group => {
    rank += 1;
    return renderGroup(group, rank);
  }).join('');
}

function getActorSections(hierarchy) {
  return [
    { key: 'friendly', label: 'Friendly Players', className: 'breakdown-section--friendly', groups: hierarchy.filter(group => getActorSectionKey(group.player) === 'friendly') },
    { key: 'hostile', label: 'Hostile Players', className: 'breakdown-section--hostile', groups: hierarchy.filter(group => getActorSectionKey(group.player) === 'hostile') },
    { key: 'other', label: 'NPCs / Pets', className: 'breakdown-section--other', groups: hierarchy.filter(group => getActorSectionKey(group.player) === 'other') }
  ];
}

function getActorSectionKey(row) {
  if (isPlayerGuid(row.guid) && row.faction === 'friendly') return 'friendly';
  if (isPlayerGuid(row.guid) && row.faction === 'hostile') return 'hostile';
  return 'other';
}

function getActorGroupClass(row) {
  return `breakdown-row--${getActorSectionKey(row)}`;
}

function renderBreakdownSectionHeader(section) {
  const total = section.groups.reduce((sum, group) => sum + group.total, 0);
  return `<div class="breakdown-section ${section.className}"><span>${section.label}</span><span>${section.groups.length} · ${formatNumber(total)}</span></div>`;
}

function renderActorTotalRow(player, amount, rank, total, fightSeconds, maxAmount, reportKey = 'default') {
  const pctOfMax = Math.max(2, (amount / maxAmount) * 100);
  const pctOfTotal = total > 0 ? (amount / total) * 100 : 0;
  const expanded = isActorGroupExpanded(player.guid, reportKey);
  const actorColor = getActorClassColor(player.guid, player.ownerGuid);
  return `<div class="breakdown-row breakdown-row--total ${getActorGroupClass(player)}" data-actor-group-guid="${escapeHtml(player.guid)}" data-report-key="${escapeHtml(reportKey)}" role="button" tabindex="0" aria-expanded="${expanded}">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info"><span class="breakdown-row__sub">${expanded ? '−' : '+'} ${rank}</span>${renderActorName(player.name, player.guid)}<span class="breakdown-row__sub">total</span></div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>
      </div>
    </div>
  </div>`;
}

function renderActorChildRow(row, total, fightSeconds, maxAmount) {
  const pctOfMax = Math.max(2, (row.amount / maxAmount) * 100);
  const pctOfTotal = total > 0 ? (row.amount / total) * 100 : 0;
  const actorColor = getActorClassColor(row.guid, row.ownerGuid);
  return `<div class="breakdown-row breakdown-row--minion ${getActorGroupClass(row)}">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info"><span class="breakdown-row__sub">${row.isPlayerActual ? 'player' : 'pet'}</span>${renderActorName(row.name, row.guid, '', row.ownerGuid)}</div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(row.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(row.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>
      </div>
    </div>
  </div>`;
}

function renderCompactRows(rows, total, fight, interactive) {
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const maxAmount = Math.max(...rows.map(row => row.amount), 1);
  return `<div class="breakdown-list">
    ${renderGroupedFlatSections(rows, (row, index) => interactive
      ? renderDamageRow(row, index, total, fightSeconds, maxAmount, false)
      : renderCompactReportRow(row, index, total, fightSeconds, maxAmount)
    )}
  </div>`;
}

function renderGroupedFlatSections(rows, renderRow) {
  let rank = 0;
  return rows.map(row => {
    rank += 1;
    return renderRow(row, rank);
  }).join('');
}

function getFlatActorSections(rows) {
  return [
    { key: 'friendly', label: 'Friendly Players', className: 'breakdown-section--friendly', rows: rows.filter(row => getActorSectionKey(row) === 'friendly') },
    { key: 'hostile', label: 'Hostile Players', className: 'breakdown-section--hostile', rows: rows.filter(row => getActorSectionKey(row) === 'hostile') },
    { key: 'other', label: 'NPCs / Pets', className: 'breakdown-section--other', rows: rows.filter(row => getActorSectionKey(row) === 'other') }
  ];
}

function renderCompactReportRow(row, rank, total, fightSeconds, maxAmount) {
  const pctOfMax = Math.max(2, (row.amount / maxAmount) * 100);
  const pctOfTotal = total > 0 ? (row.amount / total) * 100 : 0;
  const actorColor = getActorClassColor(row.guid, row.ownerGuid);
  return `<div class="breakdown-row ${getActorGroupClass(row)}">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info"><span class="breakdown-row__sub">${rank}</span>${renderActorName(row.name, row.guid, '', row.ownerGuid)}</div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(row.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(row.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>
      </div>
    </div>
  </div>`;
}

function renderCompactEmptyRow(title) {
  return `<div class="breakdown-list"><div class="breakdown-row"><div class="breakdown-row__header"><div class="breakdown-row__info"><strong>No ${escapeHtml(title.toLowerCase())}</strong><span class="breakdown-row__sub">not found in this fight window</span></div></div></div></div>`;
}

function renderBreakdownContent(fight) {
  const sourceRows = filterActorRows(buildDamageDoneRows(fight));
  const totalDamage = sourceRows.reduce((sum, row) => sum + row.amount, 0);

  return `
    <div class="breakdown-controls">
      <button class="filter-btn filter-btn--active">Damage Done</button>
      <span class="breakdown-row__sub">${escapeHtml(fight.bossName)} · ${formatDuration(fight.duration)} · ${formatNumber(totalDamage)} total</span>
    </div>
    ${renderDamageDoneTable(sourceRows, totalDamage, fight)}
  `;
}

function attachBreakdownHandlers(rootEl) {
  rootEl.querySelectorAll('[data-actor-group-guid]').forEach(row => {
    const toggleGroup = () => {
      const previousTop = row.getBoundingClientRect().top;
      toggleActorGroup(row.dataset.actorGroupGuid, row.dataset.reportKey || 'default');
      rerenderBreakdowns();
      const nextRow = document.querySelector(`[data-actor-group-guid="${cssEscape(row.dataset.actorGroupGuid)}"][data-report-key="${cssEscape(row.dataset.reportKey || 'default')}"]`);
      if (nextRow) window.scrollBy(0, nextRow.getBoundingClientRect().top - previousTop);
    };
    row.addEventListener('click', toggleGroup);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleGroup(); } });
  });

  rootEl.querySelectorAll('[data-source-guid]').forEach(row => {
    const selectSource = (event) => {
      event.stopPropagation();
      state.selectedSourceGuid = state.selectedSourceGuid === row.dataset.sourceGuid ? null : row.dataset.sourceGuid;
      state.selectedSpellKey = null;
      rerenderBreakdowns();
    };
    row.addEventListener('click', selectSource);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSource(e); } });
  });

  rootEl.querySelectorAll('[data-taken-target-guid]').forEach(row => {
    const selectTarget = (event) => {
      event.stopPropagation();
      state.selectedDamageTakenGuid = state.selectedDamageTakenGuid === row.dataset.takenTargetGuid ? null : row.dataset.takenTargetGuid;
      state.selectedDamageTakenSourceGuid = null;
      rerenderBreakdowns();
    };
    row.addEventListener('click', selectTarget);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTarget(e); } });
  });

  rootEl.querySelectorAll('[data-taken-source-guid]').forEach(row => {
    const selectSource = (event) => {
      event.stopPropagation();
      state.selectedDamageTakenSourceGuid = state.selectedDamageTakenSourceGuid === row.dataset.takenSourceGuid ? null : row.dataset.takenSourceGuid;
      rerenderBreakdowns();
    };
    row.addEventListener('click', selectSource);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSource(e); } });
  });

  rootEl.querySelectorAll('[data-spell-key]').forEach(row => {
    const selectSpell = (event) => {
      event.stopPropagation();
      state.selectedSpellKey = state.selectedSpellKey === row.dataset.spellKey ? null : row.dataset.spellKey;
      rerenderBreakdowns();
    };
    row.addEventListener('click', selectSpell);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSpell(e); } });
  });

  rootEl.querySelectorAll('.spell-row--target').forEach(row => {
    row.addEventListener('click', event => event.stopPropagation());
  });

  rootEl.querySelectorAll('.spell-row__link').forEach(link => {
    link.addEventListener('click', event => event.stopPropagation());
    link.addEventListener('keydown', event => event.stopPropagation());
  });

  const backButton = rootEl.querySelector('[data-breakdown-back]');
  if (backButton) {
    backButton.addEventListener('click', () => {
      state.selectedSourceGuid = null;
      state.selectedSpellKey = null;
      rerenderBreakdowns();
    });
  }

  const damageTakenBackButton = rootEl.querySelector('[data-damage-taken-back]');
  if (damageTakenBackButton) {
    damageTakenBackButton.addEventListener('click', () => {
      state.selectedDamageTakenGuid = null;
      state.selectedDamageTakenSourceGuid = null;
      rerenderBreakdowns();
    });
  }

  const spellBackButton = rootEl.querySelector('[data-spell-back]');
  if (spellBackButton) {
    spellBackButton.addEventListener('click', () => {
      state.selectedSpellKey = null;
      rerenderBreakdowns();
    });
  }

  attachCombatTooltips(rootEl);
  refreshWowheadTooltips();
}

function attachCombatTooltips(rootEl) {
  if (!combatTooltip) return;
  rootEl.querySelectorAll('[data-tooltip]').forEach(el => {
    const showTooltip = (event) => {
      const text = el.dataset.tooltip || '';
      if (!text) return;
      combatTooltip.innerHTML = formatCombatTooltipHtml(text);
      combatTooltip.setAttribute('aria-hidden', 'false');
      combatTooltip.classList.add('combat-tooltip--visible');
      positionCombatTooltip(event);
    };
    const moveTooltip = (event) => positionCombatTooltip(event);
    const hideTooltip = () => {
      combatTooltip.classList.remove('combat-tooltip--visible');
      combatTooltip.setAttribute('aria-hidden', 'true');
    };
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mousemove', moveTooltip);
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('focus', showTooltip);
    el.addEventListener('blur', hideTooltip);
  });
}

function positionCombatTooltip(event) {
  if (!combatTooltip) return;
  const padding = 12;
  const offset = 18;
  const rect = combatTooltip.getBoundingClientRect();
  const sourceRect = event.currentTarget?.getBoundingClientRect?.();
  const baseX = event.clientX || (sourceRect ? sourceRect.left + sourceRect.width / 2 : padding);
  const baseY = event.clientY || (sourceRect ? sourceRect.top : padding);
  let x = baseX + offset;
  let y = baseY + offset;
  if (x + rect.width + padding > window.innerWidth) x = baseX - rect.width - offset;
  if (y + rect.height + padding > window.innerHeight) y = baseY - rect.height - offset;
  combatTooltip.style.setProperty('--tooltip-x', `${Math.max(padding, x)}px`);
  combatTooltip.style.setProperty('--tooltip-y', `${Math.max(padding, y)}px`);
}

function formatCombatTooltipHtml(text) {
  const lines = String(text).split('\n');
  const title = lines.shift() || '';
  const body = lines.join('\n');
  return `<span class="combat-tooltip__title">${escapeHtml(title)}</span><span class="combat-tooltip__body">${escapeHtml(body)}</span>`;
}

function refreshWowheadTooltips() {
  if (window.$WowheadPower && typeof window.$WowheadPower.refreshLinks === 'function') {
    window.$WowheadPower.refreshLinks();
  }
}

function getActivePanelName() {
  // Use overall panel when the overall tab is visible, otherwise fight panel
  if (panels.overall && !panels.overall.classList.contains('hidden')) return state.selectedOverallPanel;
  return state.selectedFightPanel;
}

function isActorGroupExpanded(guid, reportKey = 'default') {
  return state.expandedActorGroups.has(`${getActivePanelName()}:${reportKey}:${guid}`);
}

function toggleActorGroup(guid, reportKey = 'default') {
  const key = `${getActivePanelName()}:${reportKey}:${guid}`;
  state.selectedSourceGuid = null;
  state.selectedSpellKey = null;
  state.selectedDamageTakenGuid = null;
  state.selectedDamageTakenSourceGuid = null;
  if (state.expandedActorGroups.has(key)) state.expandedActorGroups.delete(key);
  else state.expandedActorGroups.add(key);
}

function cssEscape(value) {
  if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
  return String(value).replace(/"/g, '\\"');
}

function rerenderBreakdowns() {
  if (state.currentFight) renderFightDetail();
  const breakdownPanelVisible = panels.breakdown && !panels.breakdown.classList.contains('hidden');
  if (breakdownPanelVisible) renderBreakdownView();
  const overallPanelVisible = panels.overall && !panels.overall.classList.contains('hidden');
  if (overallPanelVisible) renderOverallView();
}

function renderDamageDoneTable(rows, totalDamage, fight, reportKey = 'damage-done') {
  if (rows.length === 0) {
    return `<div class="empty-state"><h3 class="empty-state__title">No Damage Events</h3><p class="empty-state__desc">No damage events were found inside this fight window.</p></div>`;
  }

  const fightSeconds = Math.max(1, fight.duration / 1000);
  const hierarchy = buildDamageHierarchy(rows);
  if (hierarchy.length === 0) {
    return `<div class="empty-state"><h3 class="empty-state__title">No Player Damage</h3><p class="empty-state__desc">Only NPC or unowned actor damage was found in this fight window.</p></div>`;
  }
  const displayedRows = hierarchy.flatMap(group => [group.player, ...group.children]);
  const maxAmount = Math.max(...displayedRows.map(row => row.amount), 1);
  return `<div class="breakdown-list">
    ${renderGroupedActorSections(hierarchy, (group, index) => `${renderActorTotalRow(group.player, group.total, index, totalDamage, fightSeconds, maxAmount, reportKey)}${isActorGroupExpanded(group.player.guid, reportKey) ? renderExpandedActorGroup(group, totalDamage, fightSeconds, maxAmount, reportKey) : ''}`)}
  </div>`;
}

function renderExpandedActorGroup(group, totalDamage, fightSeconds, maxAmount, reportKey) {
  const playerChild = group.children.find(child => child.isPlayerActual);
  if (group.children.length === 1 && playerChild) return renderInlineSpellRows(playerChild);
  return group.children.map(child => renderDamageRow(child, '', totalDamage, fightSeconds, maxAmount, true, reportKey)).join('');
}

function buildDamageHierarchy(rows) {
  return buildActorHierarchy(rows);
}

function buildActorHierarchy(rows) {
  const playersByGuid = new Map();
  const childrenByOwner = new Map();

  rows.forEach(row => {
    if (isPlayerGuid(row.guid)) {
      playersByGuid.set(row.guid, row);
      if (!childrenByOwner.has(row.guid)) childrenByOwner.set(row.guid, []);
      if (row.amount > 0) childrenByOwner.get(row.guid).push({ ...row, isPlayerActual: true });
      return;
    }

    if (!isPlayerGuid(row.ownerGuid)) {
      playersByGuid.set(row.guid, row);
      if (!childrenByOwner.has(row.guid)) childrenByOwner.set(row.guid, []);
      if (row.amount > 0) childrenByOwner.get(row.guid).push({ ...row, isPlayerActual: true });
      return;
    }
    if (!playersByGuid.has(row.ownerGuid)) {
      playersByGuid.set(row.ownerGuid, {
        guid: row.ownerGuid,
        name: getDisplayName('', row.ownerGuid),
        faction: row.faction,
        ownerGuid: null,
        amount: 0,
        spells: []
      });
    }
    if (!childrenByOwner.has(row.ownerGuid)) childrenByOwner.set(row.ownerGuid, []);
    childrenByOwner.get(row.ownerGuid).push({ ...row, isPlayerActual: false });
  });

  return Array.from(playersByGuid.values()).map(player => {
    const children = mergeActorChildren(childrenByOwner.get(player.guid) || []).sort((a, b) => b.amount - a.amount);
    const total = children.reduce((sum, child) => sum + child.amount, 0);
    return {
      player: { ...player, amount: total },
      total,
      children,
      minions: children.filter(child => !child.isPlayerActual)
    };
  }).filter(group => group.total > 0).sort((a, b) => b.total - a.total);
}

function mergeActorChildren(children) {
  const merged = new Map();
  children.forEach(child => {
    const key = child.isPlayerActual ? `player:${child.guid}` : `pet:${normalizeActorName(child.name)}`;
    if (!merged.has(key)) {
      merged.set(key, { ...child, guid: child.isPlayerActual ? child.guid : key, spells: mergeSpellRows([], child.spells || []) });
      return;
    }
    const existing = merged.get(key);
    existing.amount += child.amount;
    existing.spells = mergeSpellRows(existing.spells || [], child.spells || []);
  });
  return Array.from(merged.values());
}

function mergeSpellRows(existingSpells, nextSpells) {
  const spells = new Map(existingSpells.map(spell => [spell.key, { ...spell }]));
  nextSpells.forEach(spell => {
    if (!spells.has(spell.key)) {
      spells.set(spell.key, { ...spell });
      return;
    }
    const current = spells.get(spell.key);
    current.amount += spell.amount;
    current.events += spell.events || 0;
    current.casts += spell.casts || 0;
    current.applications += spell.applications || 0;
    current.hits += spell.hits || 0;
    current.normals += spell.normals || 0;
    current.crits += spell.crits || 0;
    current.misses += spell.misses || 0;
    current.min = current.min === 0 ? spell.min : Math.min(current.min, spell.min || current.min);
    current.max = Math.max(current.max || 0, spell.max || 0);
    current.spellId = current.spellId || spell.spellId || 0;
    current.school = current.school || spell.school || '';
    current.schoolName = current.schoolName || spell.schoolName || '';
    current.targets = mergeTargetRows(current.targets || [], spell.targets || []);
  });
  return Array.from(spells.values()).sort((a, b) => b.amount - a.amount);
}

function mergeTargetRows(existingTargets, nextTargets) {
  const targets = new Map(existingTargets.map(target => [target.guid, { ...target }]));
  nextTargets.forEach(target => {
    if (!targets.has(target.guid)) {
      targets.set(target.guid, { ...target });
      return;
    }
    const current = targets.get(target.guid);
    current.amount += target.amount;
    current.events += target.events || 0;
    current.hits += target.hits || 0;
    current.crits += target.crits || 0;
    current.misses += target.misses || 0;
    current.min = current.min === 0 ? target.min : Math.min(current.min, target.min || current.min);
    current.max = Math.max(current.max || 0, target.max || 0);
  });
  return Array.from(targets.values()).sort((a, b) => b.amount - a.amount);
}

function normalizeActorName(name) {
  return String(name || 'unknown').trim().toLowerCase();
}

function findSelectedSpellRow(rowGroups) {
  if (!state.selectedSourceGuid) return null;
  for (const groupDef of rowGroups) {
    const rows = Array.isArray(groupDef) ? groupDef : groupDef.rows;
    const reportKey = Array.isArray(groupDef) ? 'default' : groupDef.reportKey;
    for (const group of buildActorHierarchy(rows)) {
      const selected = group.children.find(child => (child.selectionGuid || `${reportKey}:${child.guid}`) === state.selectedSourceGuid);
      if (selected) return selected;
    }
  }
  return null;
}

function renderDamageRow(row, rank, totalDamage, fightSeconds, maxAmount, isMinion, reportKey = 'damage-done') {
  const pctOfMax = Math.max(2, (row.amount / maxAmount) * 100);
  const pctOfTotal = totalDamage > 0 ? (row.amount / totalDamage) * 100 : 0;
  const selectionKey = row.selectionGuid || `${reportKey}:${row.guid}`;
  const isSelected = state.selectedSourceGuid === selectionKey;
  const actorColor = getActorClassColor(row.guid, row.ownerGuid);
  return `<div class="breakdown-row ${isMinion ? 'breakdown-row--minion' : ''} ${getActorGroupClass(row)}" data-source-guid="${escapeHtml(selectionKey)}" role="button" tabindex="0">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info">
        <span class="breakdown-row__sub">${rank || (row.isPlayerActual ? 'player' : 'pet')}</span>
        ${renderActorName(row.name, row.guid, '', row.ownerGuid)}
      </div>
      <div class="metric-bar" aria-hidden="true"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(row.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(row.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfTotal.toFixed(1)}%</span>
      </div>
    </div>
    ${isSelected && row.spells?.length ? renderInlineSpellRows(row) : ''}
  </div>`;
}

function renderInlineSpellRows(row) {
  const maxSpellAmount = row.spells[0]?.amount || 1;
  return `<div class="breakdown-row__spells">
    ${row.spells.map(spell => {
      const pctOfMax = Math.max(2, (spell.amount / maxSpellAmount) * 100);
      const pctOfSource = row.amount > 0 ? (spell.amount / row.amount) * 100 : 0;
      const selectionKey = getSpellSelectionKey(row, spell);
      const expanded = state.selectedSpellKey === selectionKey;
      return `<div class="spell-row" style="${getSpellSchoolStyle(spell)}" data-spell-key="${escapeHtml(selectionKey)}" role="button" tabindex="0" aria-expanded="${expanded}">
        <span><strong>${expanded ? '−' : '+'} ${renderSpellName(spell)}</strong><span class="breakdown-row__sub"> · ${escapeHtml(formatSpellActivity(spell))}</span></span>
        <span class="spell-bar-container" data-tooltip="${escapeHtml(formatSpellTooltip(spell))}" tabindex="0"><div class="spell-bar-fill" style="width: ${pctOfMax}%;"></div></span>
        <span style="display:grid;grid-template-columns:82px 54px;gap:8px;font-family:var(--font-mono);text-align:right;"><span>${formatNumber(spell.amount)}</span><span class="breakdown-row__sub">${pctOfSource.toFixed(1)}%</span></span>
        ${expanded ? renderInlineSpellTargetRows(spell) : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function getSpellSelectionKey(row, spell) {
  return `${row.selectionGuid || row.guid}:${spell.key}`;
}

function renderSpellName(spell) {
  const style = `color: var(--spell-school-color, ${getSpellSchoolColor(spell?.school)});`;
  if (!spell.spellId) return `<span style="${style}">${escapeHtml(spell.name)}</span>`;
  return `<a class="spell-row__link" style="${style}" href="https://www.wowhead.com/spell=${encodeURIComponent(spell.spellId)}" data-wowhead="spell=${escapeHtml(String(spell.spellId))}" target="_blank" rel="noopener noreferrer">${escapeHtml(spell.name)}</a>`;
}

function renderInlineSpellTargetRows(spell) {
  const targets = spell.targets || [];
  if (targets.length === 0) return `<div class="breakdown-row__sub">No target detail for this spell.</div>`;
  const maxTargetAmount = Math.max(...targets.map(target => target.amount), 1);
  return `<div class="breakdown-row__spells">
    ${targets.map((target, index) => {
      const pctOfMax = Math.max(2, (target.amount / maxTargetAmount) * 100);
      const pctOfSpell = spell.amount > 0 ? (target.amount / spell.amount) * 100 : 0;
      const average = target.hits > 0 ? Math.round(target.amount / target.hits) : 0;
      const tooltip = `${target.name}\nAmount: ${formatNumber(target.amount)}\nHits: ${target.hits}\nCrits: ${target.crits}\nMisses: ${target.misses}\nMin: ${formatNumber(target.min || 0)}\nMax: ${formatNumber(target.max || 0)}\nAverage: ${formatNumber(average)}`;
      return `<div class="spell-row spell-row--target" style="${getSpellSchoolStyle(spell)}">
        <span><span class="breakdown-row__sub">${index + 1}</span> ${renderActorName(target.name, target.guid)}</span>
        <span class="spell-bar-container" data-tooltip="${escapeHtml(tooltip)}" tabindex="0"><div class="spell-bar-fill" style="width: ${pctOfMax}%;"></div></span>
        <span style="display:grid;grid-template-columns:82px 54px;gap:8px;font-family:var(--font-mono);text-align:right;"><span>${formatNumber(target.amount)}</span><span class="breakdown-row__sub">${pctOfSpell.toFixed(1)}%</span></span>
      </div>`;
    }).join('')}
  </div>`;
}

function renderSourceDamageDrilldown(row, totalDamage, fight) {
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const maxSpellAmount = row.spells[0]?.amount || 1;
  return `<div class="breakdown-list">
    <button class="btn" data-breakdown-back type="button">Back to Damage Done</button>
    <div class="breakdown-row">
      <div class="breakdown-row__header">
        <div class="breakdown-row__info">
          ${renderActorName(row.name, row.guid)}
          <span class="breakdown-row__sub">${formatNumber(row.amount)} · ${formatNumber(Math.round(row.amount / fightSeconds))}/s · ${(totalDamage > 0 ? (row.amount / totalDamage) * 100 : 0).toFixed(1)}%</span>
        </div>
      </div>
      <div class="breakdown-row__spells">
        ${row.spells.map(spell => {
          const pctOfMax = Math.max(2, (spell.amount / maxSpellAmount) * 100);
          const pctOfSource = row.amount > 0 ? (spell.amount / row.amount) * 100 : 0;
          return `<div class="spell-row" style="${getSpellSchoolStyle(spell)}" data-spell-key="${escapeHtml(spell.key)}" role="button" tabindex="0">
            <span><strong>${renderSpellName(spell)}</strong><span class="breakdown-row__sub"> · ${escapeHtml(formatSpellActivity(spell))}</span></span>
            <span class="spell-bar-container" data-tooltip="${escapeHtml(formatSpellTooltip(spell))}" tabindex="0"><div class="spell-bar-fill" style="width: ${pctOfMax}%;"></div></span>
            <span style="display:grid;grid-template-columns:82px 54px;gap:8px;font-family:var(--font-mono);text-align:right;"><span>${formatNumber(spell.amount)}</span><span class="breakdown-row__sub">${pctOfSource.toFixed(1)}%</span></span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function renderSpellDamageDrilldown(row, spell, fight) {
  const average = spell.hits > 0 ? Math.round(spell.amount / spell.hits) : 0;
  const critRate = spell.hits > 0 ? (spell.crits / spell.hits) * 100 : 0;
  const missRate = (spell.hits + spell.misses) > 0 ? (spell.misses / (spell.hits + spell.misses)) * 100 : 0;
  const actorColor = isPlayerGuid(row.guid) ? getPlayerClassColor(row.guid) : 'var(--ink-muted)';
  const targets = spell.targets || [];
  const maxTargetAmount = Math.max(...targets.map(target => target.amount), 1);
  return `<div class="breakdown-list">
    <button class="btn" data-spell-back type="button">Back to ${escapeHtml(row.name)}</button>
    <div class="breakdown-row">
      <div class="breakdown-row__header" style="${getSpellSchoolStyle(spell)} --actor-color: var(--spell-school-color);">
        <div class="breakdown-row__info">
          <strong>${renderSpellName(spell)}</strong>
          <span class="breakdown-row__sub"><span style="color: ${actorColor};">${escapeHtml(row.name)}</span> · ${escapeHtml(spell.schoolName || 'Unknown school')} · ${formatNumber(spell.amount)} damage</span>
        </div>
        <div class="metric-bar" data-tooltip="${escapeHtml(formatSpellTooltip(spell))}" tabindex="0"><div class="metric-bar__fill" style="width: 100%;"></div></div>
        <div class="breakdown-row__metrics">
          <span class="breakdown-row__val">${formatNumber(spell.amount)}</span>
          <span class="breakdown-row__sub">${escapeHtml(formatSpellActivity(spell))}</span>
        </div>
      </div>
      <div class="breakdown-row__spells">
        ${targets.length > 0 ? `<div class="breakdown-list">
          ${targets.map((target, index) => renderSpellTargetRow(target, index + 1, spell.amount, maxTargetAmount, fight)).join('')}
        </div>` : '<div class="breakdown-row__sub">No target detail for this spell.</div>'}
        <div class="metric-grid">
          ${renderMetricCard('school', spell.schoolName || 'Unknown')}
          ${renderMetricCard(spell.applications > 0 ? 'applications' : 'casts', spell.applications > 0 ? spell.applications : spell.casts)}
          ${renderMetricCard('events', spell.events)}
          ${renderMetricCard('hits', spell.hits)}
          ${renderMetricCard('normal', spell.normals)}
          ${renderMetricCard('crits', spell.crits)}
          ${renderMetricCard('crit rate', `${critRate.toFixed(1)}%`)}
          ${renderMetricCard('misses', spell.misses)}
          ${renderMetricCard('miss rate', `${missRate.toFixed(1)}%`)}
          ${renderMetricCard('min', formatNumber(spell.min || 0))}
          ${renderMetricCard('max', formatNumber(spell.max || 0))}
          ${renderMetricCard('average', formatNumber(average))}
        </div>
      </div>
    </div>
  </div>`;
}

function renderSpellTargetRow(target, rank, totalAmount, maxAmount, fight) {
  const fightSeconds = Math.max(1, fight.duration / 1000);
  const pctOfMax = Math.max(2, (target.amount / maxAmount) * 100);
  const pctOfSpell = totalAmount > 0 ? (target.amount / totalAmount) * 100 : 0;
  const average = target.hits > 0 ? Math.round(target.amount / target.hits) : 0;
  const tooltip = `${target.name}\nDamage: ${formatNumber(target.amount)}\nHits: ${target.hits}\nCrits: ${target.crits}\nMisses: ${target.misses}\nMin: ${formatNumber(target.min || 0)}\nMax: ${formatNumber(target.max || 0)}\nAverage: ${formatNumber(average)}`;
  const actorColor = getActorClassColor(target.guid, target.ownerGuid);
  return `<div class="breakdown-row ${getActorGroupClass(target)}">
    <div class="breakdown-row__header" style="--actor-color: ${actorColor};">
      <div class="breakdown-row__bg-bar" style="width: ${pctOfMax}%; background-color: ${actorColor};"></div>
      <div class="breakdown-row__info"><span class="breakdown-row__sub">${rank}</span>${renderActorName(target.name, target.guid)}</div>
      <div class="metric-bar" data-tooltip="${escapeHtml(tooltip)}" tabindex="0"><div class="metric-bar__fill" style="width: ${pctOfMax}%;"></div></div>
      <div class="breakdown-row__metrics">
        <span class="breakdown-row__val">${formatNumber(target.amount)}</span>
        <span class="breakdown-row__sub" style="text-align:right;">${formatNumber(Math.round(target.amount / fightSeconds))}/s</span>
        <span class="breakdown-row__sub" style="text-align:right;">${pctOfSpell.toFixed(1)}%</span>
      </div>
    </div>
  </div>`;
}

function renderMetricCard(label, value) {
  return `<div class="metric-card"><span class="metric-card__label">${escapeHtml(label)}</span><span class="metric-card__value">${escapeHtml(String(value))}</span></div>`;
}

function formatSpellActivity(spell) {
  const parts = [];
  if (spell.applications > 0) parts.push(`${spell.applications} applications`);
  else if (spell.casts > 0) parts.push(`${spell.casts} casts`);
  if (spell.hits > 0) parts.push(`${spell.hits} hits`);
  if (spell.misses > 0) parts.push(`${spell.misses} misses`);
  if (parts.length === 0) parts.push(`${spell.events} events`);
  return parts.join(' · ');
}

function formatSpellTooltip(spell) {
  const average = spell.hits > 0 ? Math.round(spell.amount / spell.hits) : 0;
  const critRate = spell.hits > 0 ? (spell.crits / spell.hits) * 100 : 0;
  const missRate = (spell.hits + spell.misses) > 0 ? (spell.misses / (spell.hits + spell.misses)) * 100 : 0;
  return `${spell.name}\nSchool: ${spell.schoolName || 'Unknown'}\nDamage: ${formatNumber(spell.amount)}\nEvents: ${spell.events}\nHits: ${spell.hits}\nCrits: ${spell.crits} (${critRate.toFixed(1)}%)\nMisses: ${spell.misses} (${missRate.toFixed(1)}%)\nMin: ${formatNumber(spell.min || 0)}\nMax: ${formatNumber(spell.max || 0)}\nAverage: ${formatNumber(average)}`;
}

function formatSpellSchool(school) {
  const value = typeof school === 'string' && school.startsWith('0x') ? parseInt(school, 16) : Number(school);
  if (!Number.isFinite(value) || value === 0) return '';
  const schools = [
    [0x1, 'Physical'],
    [0x2, 'Holy'],
    [0x4, 'Fire'],
    [0x8, 'Nature'],
    [0x10, 'Frost'],
    [0x20, 'Shadow'],
    [0x40, 'Arcane']
  ];
  return schools.filter(([bit]) => (value & bit) === bit).map(([, name]) => name).join('/') || String(school);
}

function getSpellSchoolNames(school) {
  const schoolName = formatSpellSchool(school);
  if (!schoolName) return ['Unknown'];
  return schoolName.split('/').filter(Boolean);
}

function getSpellSchoolColor(school) {
  const schools = getSpellSchoolNames(school);
  return SPELL_SCHOOL_COLORS[schools.find(name => name !== 'Physical') || schools[0]] || SPELL_SCHOOL_COLORS.Unknown;
}

function getSpellSchoolFill(school) {
  const color = getSpellSchoolColor(school);
  return `linear-gradient(90deg, ${color}, ${color})`;
}

function getSpellSchoolStyle(spell) {
  const color = getSpellSchoolColor(spell?.school);
  return `--spell-school-color: ${color}; --spell-school-fill: ${getSpellSchoolFill(spell?.school)}; --spell-school-glow: ${color}66;`;
}

function buildDamageDoneRows(fight) {
  const sources = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    const damage = parseDamageEvent(event.type, event.params);
    if (!damage || !isValidActorGuid(damage.sourceGuid)) continue;
    if (!filterEventByActor(damage.sourceGuid, damage.destGuid)) continue;

    if (!sources.has(damage.sourceGuid)) {
      sources.set(damage.sourceGuid, {
        guid: damage.sourceGuid,
        name: getDisplayName(damage.sourceName, damage.sourceGuid),
        faction: getReactionGroup(damage.sourceFlags),
        ownerGuid: state.petOwners.get(damage.sourceGuid) || null,
        amount: 0,
        spells: new Map()
      });
    }

    const source = sources.get(damage.sourceGuid);
    source.amount += damage.amount;
    const spellKey = `${damage.spellId || 0}:${damage.spellName}`;
    const currentSpell = source.spells.get(spellKey) || createSpellRow(spellKey, damage.spellName, damage.spellSchool);
    addDamageToSpellRow(currentSpell, damage);
    source.spells.set(spellKey, currentSpell);
  }

  return Array.from(sources.values())
    .filter(source => source.amount > 0)
    .map(source => ({
      ...source,
      spells: Array.from(source.spells.values()).sort((a, b) => b.amount - a.amount)
    }))
    .sort((a, b) => b.amount - a.amount);
}

function buildDamageTakenRows(fight) {
  const targets = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    const damage = parseDamageEvent(event.type, event.params);
    if (!damage || damage.amount <= 0) continue;
    if (!filterEventByActor(damage.sourceGuid, damage.destGuid)) continue;
    if (!isValidActorGuid(damage.destGuid)) continue;
    const ownerGuid = state.petOwners.get(damage.destGuid) || null;
    if (!targets.has(damage.destGuid)) {
      targets.set(damage.destGuid, {
        guid: damage.destGuid,
        name: getDisplayName(damage.destName, damage.destGuid),
        ownerGuid,
        faction: getReactionGroup(damage.destFlags),
        amount: 0,
        spells: new Map()
      });
    }
    const target = targets.get(damage.destGuid);
    target.amount += damage.amount;
    const spellKey = `${damage.spellId || 0}:${damage.spellName}`;
    const currentSpell = target.spells.get(spellKey) || createSpellRow(spellKey, damage.spellName, damage.spellSchool);
    addAmountToSpellRow(currentSpell, {
      amount: damage.amount,
      isCrit: damage.isCrit,
      isMiss: damage.isMiss,
      peerGuid: damage.sourceGuid,
      peerName: damage.sourceName
    });
    target.spells.set(spellKey, currentSpell);
  }
  return mapToSortedRowsWithSpells(targets);
}

function buildDamageTakenSourceRows(fight, targetGuid) {
  const sources = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    const damage = parseDamageEvent(event.type, event.params);
    if (!damage) continue;
    if (!filterEventByActor(damage.sourceGuid, damage.destGuid)) continue;
    const targetMatches = damage.destGuid === targetGuid || (isPlayerGuid(targetGuid) && state.petOwners.get(damage.destGuid) === targetGuid);
    if (!targetMatches || !isValidActorGuid(damage.sourceGuid) || damage.amount <= 0) continue;
    const sourceOwnerGuid = state.petOwners.get(damage.sourceGuid) || null;

    if (!sources.has(damage.sourceGuid)) {
      sources.set(damage.sourceGuid, {
        guid: damage.sourceGuid,
        name: getDisplayName(damage.sourceName, damage.sourceGuid),
        faction: getReactionGroup(damage.sourceFlags),
        ownerGuid: sourceOwnerGuid,
        amount: 0,
        spells: new Map()
      });
    }

    const source = sources.get(damage.sourceGuid);
    source.amount += damage.amount;
    const spellKey = `${damage.spellId || 0}:${damage.spellName}`;
    const currentSpell = source.spells.get(spellKey) || createSpellRow(spellKey, damage.spellName, damage.spellSchool);
    addDamageToSpellRow(currentSpell, damage);
    source.spells.set(spellKey, currentSpell);
  }

  return Array.from(sources.values())
    .map(source => ({
      ...source,
      spells: Array.from(source.spells.values()).sort((a, b) => b.amount - a.amount)
    }))
    .sort((a, b) => b.amount - a.amount);
}

function buildHealingRows(fight, actorSide) {
  const actors = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    const healing = parseHealingEvent(event.type, event.params);
    if (!healing || healing.amount <= 0) continue;
    if (!filterEventByActor(healing.sourceGuid, healing.destGuid)) continue;
    const guid = actorSide === 'dest' ? healing.destGuid : healing.sourceGuid;
    const name = actorSide === 'dest' ? healing.destName : healing.sourceName;
    const flags = actorSide === 'dest' ? healing.destFlags : healing.sourceFlags;
    const peerGuid = actorSide === 'dest' ? healing.sourceGuid : healing.destGuid;
    const peerName = actorSide === 'dest' ? healing.sourceName : healing.destName;
    const ownerGuid = state.petOwners.get(guid) || null;
    if (!isValidActorGuid(guid)) continue;
    if (!actors.has(guid)) {
      actors.set(guid, {
        guid,
        name: getDisplayName(name, guid),
        ownerGuid,
        faction: getReactionGroup(flags),
        amount: 0,
        spells: new Map()
      });
    }
    const actor = actors.get(guid);
    actor.amount += healing.amount;
    const spellKey = `${healing.spellId || 0}:${healing.spellName}`;
    const currentSpell = actor.spells.get(spellKey) || createSpellRow(spellKey, healing.spellName, healing.spellSchool);
    addAmountToSpellRow(currentSpell, {
      amount: healing.amount,
      isCrit: healing.isCrit,
      isMiss: false,
      peerGuid,
      peerName
    });
    actor.spells.set(spellKey, currentSpell);
  }
  return mapToSortedRowsWithSpells(actors);
}

function buildEventCountRows(fight, typeTokens) {
  const actors = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    if (!typeTokens.some(token => event.type.includes(token))) continue;
    const fields = parseCombatLogFields(event.params);
    const useDest = !isValidActorGuid(fields.sourceGuid) && isValidActorGuid(fields.destGuid);
    const guid = useDest ? fields.destGuid : fields.sourceGuid;
    const name = useDest ? fields.destName : fields.sourceName;
    const flags = useDest ? fields.destFlags : fields.sourceFlags;
    const ownerGuid = state.petOwners.get(guid) || null;
    if (!isValidActorGuid(guid)) continue;
    if (!filterEventByActor(fields.sourceGuid, fields.destGuid)) continue;
    addReportAmount(actors, guid, getDisplayName(name, guid), 1, ownerGuid, getReactionGroup(flags));
  }
  return mapToSortedRows(actors);
}

function buildAuraRows(fight, auraKind) {
  const actors = new Map();
  for (const event of state.events) {
    if (event.lineNo < fight.startLineNo || event.lineNo > fight.endLineNo) continue;
    if (!event.type.includes('AURA_')) continue;
    const fields = parseCombatLogFields(event.params);
    const auraType = (fields.payload[3] || fields.payload[fields.payload.length - 1] || '').toLowerCase();
    if (auraKind === 'buff' && auraType !== 'buff') continue;
    if (auraKind === 'debuff' && auraType !== 'debuff') continue;
    const guid = fields.destGuid || fields.sourceGuid || '';
    const name = fields.destName || fields.sourceName || '';
    const flags = fields.destGuid ? fields.destFlags : fields.sourceFlags;
    const ownerGuid = state.petOwners.get(guid) || null;
    if (!isValidActorGuid(guid)) continue;
    if (!filterEventByActor(fields.sourceGuid, fields.destGuid)) continue;
    addReportAmount(actors, guid, getDisplayName(name, guid), 1, ownerGuid, getReactionGroup(flags));
  }
  return mapToSortedRows(actors);
}

function addReportAmount(map, guid, name, amount, ownerGuid = null, faction = 'unknown') {
  if (!map.has(guid)) map.set(guid, { guid, name, ownerGuid, faction, amount: 0 });
  if (ownerGuid && !map.get(guid).ownerGuid) map.get(guid).ownerGuid = ownerGuid;
  if (faction !== 'unknown') map.get(guid).faction = faction;
  map.get(guid).amount += amount;
}

function createSpellRow(key, name, school = '') {
  return {
    key,
    spellId: parseInt(String(key).split(':')[0], 10) || 0,
    name,
    school,
    schoolName: formatSpellSchool(school),
    amount: 0,
    events: 0,
    casts: 0,
    applications: 0,
    hits: 0,
    normals: 0,
    crits: 0,
    misses: 0,
    min: 0,
    max: 0,
    targets: []
  };
}

function addDamageToSpellRow(spell, damage) {
  spell.amount += damage.amount;
  spell.events += 1;
  if (damage.isCast) spell.casts += 1;
  if (damage.isAura) spell.applications += 1;
  if (damage.isMiss) spell.misses += 1;
  if (damage.amount > 0) {
    spell.hits += 1;
    if (damage.isCrit) spell.crits += 1;
    else spell.normals += 1;
    spell.min = spell.min === 0 ? damage.amount : Math.min(spell.min, damage.amount);
    spell.max = Math.max(spell.max, damage.amount);
  }
  addDamageToTargetRows(spell, damage);
}

function addDamageToTargetRows(spell, damage) {
  if (!isValidActorGuid(damage.destGuid)) return;
  const targets = new Map((spell.targets || []).map(target => [target.guid, target]));
  const target = targets.get(damage.destGuid) || {
    guid: damage.destGuid,
    name: getDisplayName(damage.destName, damage.destGuid),
    amount: 0,
    events: 0,
    hits: 0,
    crits: 0,
    misses: 0,
    min: 0,
    max: 0
  };
  target.amount += damage.amount;
  target.events += 1;
  if (damage.isMiss) target.misses += 1;
  if (damage.amount > 0) {
    target.hits += 1;
    if (damage.isCrit) target.crits += 1;
    target.min = target.min === 0 ? damage.amount : Math.min(target.min, damage.amount);
    target.max = Math.max(target.max, damage.amount);
  }
  targets.set(damage.destGuid, target);
  spell.targets = Array.from(targets.values()).sort((a, b) => b.amount - a.amount);
}

function addAmountToSpellRow(spell, detail) {
  spell.amount += detail.amount;
  spell.events += 1;
  if (detail.isMiss) spell.misses += 1;
  if (detail.amount > 0) {
    spell.hits += 1;
    if (detail.isCrit) spell.crits += 1;
    else spell.normals += 1;
    spell.min = spell.min === 0 ? detail.amount : Math.min(spell.min, detail.amount);
    spell.max = Math.max(spell.max, detail.amount);
  }
  if (!isValidActorGuid(detail.peerGuid)) return;
  const targets = new Map((spell.targets || []).map(target => [target.guid, target]));
  const target = targets.get(detail.peerGuid) || {
    guid: detail.peerGuid,
    name: getDisplayName(detail.peerName, detail.peerGuid),
    amount: 0,
    events: 0,
    hits: 0,
    crits: 0,
    misses: 0,
    min: 0,
    max: 0
  };
  target.amount += detail.amount;
  target.events += 1;
  if (detail.isMiss) target.misses += 1;
  if (detail.amount > 0) {
    target.hits += 1;
    if (detail.isCrit) target.crits += 1;
    target.min = target.min === 0 ? detail.amount : Math.min(target.min, detail.amount);
    target.max = Math.max(target.max, detail.amount);
  }
  targets.set(detail.peerGuid, target);
  spell.targets = Array.from(targets.values()).sort((a, b) => b.amount - a.amount);
}

function mapToSortedRows(map) {
  return Array.from(map.values()).sort((a, b) => b.amount - a.amount);
}

function mapToSortedRowsWithSpells(map) {
  return Array.from(map.values())
    .filter(row => row.amount > 0)
    .map(row => ({
      ...row,
      spells: Array.from(row.spells.values()).sort((a, b) => b.amount - a.amount)
    }))
    .sort((a, b) => b.amount - a.amount);
}

function parseHealingEvent(type, rawEventParams) {
  if (!type.includes('_HEAL')) return null;
  const fields = parseCombatLogFields(rawEventParams);
  const payload = fields.payload;
  if (payload.length < 4) return null;
  const amountIndex = getCombatLogAmountIndex(payload, 3);
  return {
    sourceGuid: fields.sourceGuid,
    sourceName: fields.sourceName,
    sourceFlags: fields.sourceFlags,
    destGuid: fields.destGuid,
    destName: fields.destName,
    destFlags: fields.destFlags,
    spellId: parseInt(payload[0], 10) || 0,
    spellName: payload[1] || type,
    spellSchool: payload[2] || '',
    amount: readPositiveNumber(payload[amountIndex]) || readPositiveNumber(payload[3]) || readPositiveNumber(payload[7]) || readFirstLikelyAmount(payload, 3),
    isCrit: payload[amountIndex + 5] === '1' || readHitFlags(payload[amountIndex + 5]).crit
  };
}

function parseDamageEvent(type, rawEventParams) {
  const isSwingDamage = type.startsWith('SWING_DAMAGE');
  const isSwingMiss = type.startsWith('SWING_MISSED');
  const isDamage = type.includes('_DAMAGE') || isSwingDamage || type.startsWith('RANGE_DAMAGE');
  const isMiss = type.includes('_MISSED') || isSwingMiss || type.startsWith('RANGE_MISSED');
  if (!isDamage && !isMiss) return null;

  const fields = parseCombatLogFields(rawEventParams);
  const payload = fields.payload;
  if (payload.length === 0) return null;

  const result = {
    sourceGuid: fields.sourceGuid,
    sourceName: fields.sourceName,
    sourceFlags: fields.sourceFlags,
    destGuid: fields.destGuid,
    destName: fields.destName,
    destFlags: fields.destFlags,
    spellId: 0,
    spellName: type === 'SWING_DAMAGE' ? 'Melee' : type,
    spellSchool: '',
    amount: 0,
    isCrit: false,
    isMiss,
    isCast: false,
    isAura: false
  };

  if (isSwingDamage || isSwingMiss) {
    const amountIndex = getCombatLogAmountIndex(payload, 0);
    result.spellName = 'Melee';
    result.spellSchool = '0x1';
    result.amount = readPositiveNumber(payload[amountIndex]) || readPositiveNumber(payload[0]) || readFirstLikelyAmount(payload, amountIndex);
    result.isCrit = readHitFlags(payload[amountIndex + 5]).crit;
    return result;
  }

  if (type === 'ENVIRONMENTAL_DAMAGE') {
    const environmentalTypeIndex = isGuidLike(payload[0]) ? getCombatLogAmountIndex(payload, 0) : 0;
    result.spellName = payload[environmentalTypeIndex] || 'Environmental';
    result.spellSchool = payload[environmentalTypeIndex + 3] || '0x1';
    result.amount = readPositiveNumber(payload[environmentalTypeIndex + 1]) || readFirstLikelyAmount(payload, environmentalTypeIndex + 1);
    result.isCrit = readHitFlags(payload[environmentalTypeIndex + 6]).crit;
    return result;
  }

  result.spellId = parseInt(payload[0], 10) || 0;
  result.spellName = payload[1] || type;
  result.spellSchool = payload[2] || '';
  if (isDamage) {
    const amountIndex = getCombatLogAmountIndex(payload, 3);
    result.amount = readPositiveNumber(payload[amountIndex]) || readPositiveNumber(payload[7]) || readFirstLikelyAmount(payload, amountIndex);
    result.isCrit = readHitFlags(payload[amountIndex + 5]).crit || payload[amountIndex + 5] === '1';
  }
  return result;
}

function getCombatLogAmountIndex(payload, advancedFieldsStartIndex) {
  return isGuidLike(payload[advancedFieldsStartIndex]) ? advancedFieldsStartIndex + 19 : advancedFieldsStartIndex;
}

function readHitFlags(value) {
  const flags = parseInt(value, 10) || 0;
  return { crit: (flags & 1) === 1 };
}

function readPositiveNumber(value) {
  const num = Number(value);
  return Number.isFinite(num) && num > 0 ? num : 0;
}

function readFirstLikelyAmount(parts, startIndex) {
  for (let i = startIndex; i < parts.length; i++) {
    const num = readPositiveNumber(parts[i]);
    if (num >= 100) return num;
  }
  return 0;
}

function getDisplayName(name, guid) {
  const cleaned = cleanActorName(name);
  if (cleaned) return cleaned;
  if (guid && state.playerNames?.has(guid)) return state.playerNames.get(guid);
  if (guid && guid.startsWith('Player-')) return guid;
  return guid ? guid.split('-').pop() : 'Unknown';
}

function cleanActorName(name) {
  const cleaned = typeof name === 'string' ? name.trim() : '';
  if (!cleaned || cleaned.toLowerCase() === 'nil' || cleaned === '0x0000000000000000' || cleaned === '0000000000000000') return '';
  return cleaned;
}

function isValidActorGuid(guid) {
  return Boolean(guid && guid !== '0000000000000000' && guid !== '0x0000000000000000');
}

function isPlayerGuid(guid) {
  return isValidActorGuid(guid) && guid.startsWith('Player-');
}

// ============================================
// UTILITIES
// ============================================

function escapeHtml(unsafe) {
  if (typeof unsafe !== 'string') return unsafe;
  return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDuration(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}m ${seconds}s`;
}

function formatFightDate(date) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return 'Unknown date';
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatFightTime(date) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '--:--:--';
  return date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatNumber(num) {
  if (!Number.isFinite(num)) return '0';
  if (num >= 1000000000) return `${(num / 1000000000).toFixed(2)}B`;
  if (num >= 1000000) return `${(num / 1000000).toFixed(2)}M`;
  if (num >= 1000) return `${(num / 1000).toFixed(1)}K`;
  return Math.round(num).toLocaleString();
}
